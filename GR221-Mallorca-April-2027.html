<script id="markdown-source" type="text/plain"># GR221 Mallorca — Ruta de Pedra en Sec

## 1. Route Overview

### 1.1 Identity & Geography

✓ **Recommended for your trip:** spend **7–8 nights on Mallorca**, starting **21 April 2027**, and walk **Valldemossa → Deià → Sóller → Tossals Verds → Lluc → Pollença** in five hiking days. Add Esporles for a sixth hiking day. This keeps the central mountain stages and leaves time for travel and a contingency day. A full traverse is better with a longer holiday.

**Planning assumptions:** solo adult, one backpack, indoor accommodation, independent hiking, public transport where practical, and 21 April treated as arrival day. Dormitory beds are acceptable for planning purposes; private-room alternatives appear below. No accommodation has been reserved and no April 2027 availability is confirmed.

The GR221 crosses Mallorca’s Serra de Tramuntana in Spain’s Balearic Islands, usually southwest to northeast. The current official main itinerary runs **Port d’Andratx → Port de Pollença**. Many older accounts finish in **Pollença town**, about 7 km inland. The council website gives **150.1 km** for the main route; its July 2026 leaflet gives **150.2 km**. Treat it as approximately **150 km**, with actual walking dependent on accommodation approaches and variants. [Official route overview](https://caminsdepedra.conselldemallorca.es/en/dry-stone-route-gr-221), [July 2026 official map](https://caminsdepedra.conselldemallorca.es/documents/995858/996207/fulleto_ruta_pedra_sec_A3.pdf/ef144427-463a-db66-86dc-dbc397734962?t=1784205709571).

The highest main-route pass is around **1,200 m**. Published full-traverse tracks commonly accumulate roughly **5,500 m ↑ and ↓**, but there is no single verified total covering every lodging/variant combination. Budget **9–11 hiking days** for a sensibly split full traverse, plus travel; faster versions require long days. [Full-traverse track account](https://www.hikingexperience.net/en/trails/map-and-stages-gr221/).

### 1.2 Character & Experience

This is a mountain-and-village trek with sea views, olive terraces, old stone paths, oak woodland and bare limestone passes. It is not continuously coastal, and its inland days can feel far removed from Mallorca’s beach resorts.

For choosing sections, the strongest appeal is the contrast: Valldemossa’s high ridge, the agricultural paths around Deià, the stone staircase through Biniaraix, then the higher country above Tossals Verds. The southwest adds particularly good Dragonera views. [Council: southwest stage](https://caminsdepedra.conselldemallorca.es/en/-/etapa-2-sant-elm-estellencs), [Council: Biniaraix and Cúber](https://caminsdepedra.conselldemallorca.es/en/-/etapa-6-muleta-tossals-verds).

Refuges can make a solo trip sociable, but village accommodation also gives you privacy and better control over meals. You can mix them without luggage transfers.

### 1.3 At a Glance

| Decision | What it means for you |
|---|---|
| Best fit | Five or six walking days within 7–8 nights |
| Effort | Moderate overall, with demanding mountain days; not uniformly easy |
| Typical daily commitment | About 4–7 h moving; allow breaks and extra navigation time |
| Main bottleneck | A confirmed bed and meals at Tossals Verds |
| Most useful adjustment | Sleep in Sóller town before the climb to Tossals Verds |
| Best season fit | Late April is a strong choice, with rain/wind contingencies |
| Pack strategy | Indoor nights; no tent or stove needed for the recommended plan |
| Key uncertainty | April 2027 transport, accommodation inventory and trail conditions |

> 📅 **Checked: 12 September 2026.** The **Mallorca 312 cycling event is scheduled for Saturday 24 April 2027**. The organizer confirms closed roads. Expect possible transport disruption and extra accommodation demand; the precise 2027 closure timetable was not established. [Event organizer](https://mallorca312.com/en/).

## 2. Route & Stage Breakdown

### 2.1 Standard Itinerary

The official stage divisions are useful for identifying paths, but some are too long for a relaxed holiday. **An official stage is not necessarily a recommended day.** Figures below reproduce council stage data, rounded to 0.1 km; walking times exclude your breaks. The final row’s elevation is an approximate planning allowance because its detailed official page could not be retrieved.

| Official stage | Route | km | ↑ m | ↓ m | Moving time | Overnight / practical interpretation |
|---|---|---:|---:|---:|---|---|
| 1 | Port d’Andratx → Sant Elm | 9.2 | 372 | 372 | 3 h 20 min | Sant Elm; manageable opening day |
| 2 | Sant Elm → Estellencs | 24.7 | 1,010 | 912 | 8 h 40 min | Estellencs; consider splitting via Ses Fontanelles |
| 3 | Estellencs → Esporles | 14.4 | 670 | 629 | 4 h 50 min | Esporles; Banyalbufar is an intermediate stop |
| 4 | Esporles → Can Boi, Deià | 23.2 | 1,325 | 1,387 | 8 h 10 min | **Split at Valldemossa** |
| 5 | Can Boi → Muleta | 9.9 | 362 | 385 | 3 h 06 min | Muleta; alternatively branch to Sóller town |
| 6 | Muleta → Tossals Verds | 27.8 | 1,111 | 696 | 9 h 05 min | **Start in Sóller to shorten it** |
| 7 | Tossals Verds → Son Amer | 15.1 | 869 | 848 | 5 h 35 min | Son Amer or nearby Lluc monastery |
| 8 | Son Amer → Pont Romà, Pollença | 17.5 | 189 | 677 | 4 h 45 min | Pollença; logical finish for a shorter trek |
| 9 | Pollença → Port de Pollença | About 6.7–7 | About 0–100 | About 50–150 | About 2 h | Optional sea finish for a partial-route holiday |

Sources: council pages for [stage 1](https://caminsdepedra.conselldemallorca.es/en/-/etapa-1-port-d-andratx-sant-elm), [stage 2](https://caminsdepedra.conselldemallorca.es/en/-/etapa-2-sant-elm-estellencs), [stage 3](https://caminsdepedra.conselldemallorca.es/en/-/etapa-3-estellencs-esporles), [stage 4](https://caminsdepedra.conselldemallorca.es/en/-/stage-3-esporles-can-boi), [stage 5](https://caminsdepedra.conselldemallorca.es/en/-/stage-4-can-boi-muleta), [stage 6](https://caminsdepedra.conselldemallorca.es/en/-/etapa-6-muleta-tossals-verds), [stage 7](https://caminsdepedra.conselldemallorca.es/en/-/etapa-7-tossals-verds-son-amer), [stage 8](https://caminsdepedra.conselldemallorca.es/en/-/etapa-7-son-amer-pont-roma); [finish extension account](https://www.talesofatrail.com/gr221/our-stages).

**Confidence: High** for the quoted official stage figures; **Medium** for how closely your final track will match them. The stage-page distances do not exactly reconcile with the council’s headline route total. Do not combine measurements from different variants into a supposedly precise total.

### 2.2 Stage-by-Stage Analysis

| Section | Terrain, appeal and practical implications |
|---|---|
| Port d’Andratx → Sant Elm | A shorter opening walk with climbs despite coastal endpoints. Buy supplies before leaving; village services at both ends. Worth including when completing the southwest, less essential on a one-week highlights trip. |
| Sant Elm → Estellencs | La Trapa, sea cliffs and Dragonera views are the main reward. The full official day is long and exposed to weather. Carry lunch and the full day’s water; do not assume a mapped spring or La Trapa supplies refreshments. Ses Fontanelles can split the walking, subject to an actual booking. |
| Estellencs → Esporles | Terrace country, Banyalbufar and the Camí des Correu. Repeated smaller climbs rather than one high pass. Banyalbufar offers an opportunity for a meal or a shorter day; verify business opening hours. This is the best extra stage for cultural scenery. |
| Esporles → Valldemossa | Approximately 9–10 km, roughly ↑600–700 m and ↓400–500 m; allow 3.5–4.5 h. A wooded climb and a useful short opening day. Son Cabaspre has an official warning about missing signs; offline navigation matters. |
| Valldemossa → Deià | Roughly 12–14 km depending on the ascent; about ↑600–750 m and ↓900–1,000 m, 4.5–6 h. High views and a substantial descent make it a priority. Carry lunch and water; choose the actual GPX before deciding whether an access permit is needed. |
| Deià → Muleta or Sóller | A gentler day among olive groves and old paths. Muleta gives a sea-view overnight; the Camí des Rost branch gives a practical finish in Sóller town. Approximately 10–12 km to town, about ↑300–400 m; exact descent depends on the variant. Shops and meals are easier at the town finish. |
| Sóller → Tossals Verds | About 20–23 km and approximately ↑1,000–1,100 m via Biniaraix, Cúber and the main route; allow 6.5–8 h moving. Start early. The Barranc climb is sustained; Cúber is a road crossing, not a dependable shop. Choose the non-Pas-Llis route explicitly. |
| Tossals Verds → Lluc / Son Amer | A full mountain day over the high pass, followed by a long rocky descent and woodland. Carry all lunch and water. No intermediate village or staffed meal stop. Lluc and Son Amer are different endpoints; allow extra walking between them. |
| Lluc / Son Amer → Pollença | Woodland around Binifaldó, then a long descent and lower valley walking. Less dramatic than the high stages, but a satisfying finish. Its length can still tire sore feet. Carry lunch rather than depend on an intermediate business. |
| Pollença → Port de Pollença | Low, comparatively easy walking to the sea. It does not add another mountain highlight. Older walkers report road-side walking; check the current official alignment before deciding. A bus finish preserves time for Pollença itself. |

The split-stage figures are **planning ranges**, not newly measured GPX statistics. They combine the council’s stage descriptions with [local guide variants into Sóller](https://www.mallorcahiking.com/most-popular-tours/gr221-stage-3b-dei%C3%A0-puerto-de-s%C3%B3ller-or-s%C3%B3ller/), [a mapped Sóller–Tossals itinerary](https://www.komoot.com/collection/2235396/-an-alternative-to-magaluf-the-gr221-mallorca), and [firsthand stage accounts](https://www.talesofatrail.com/gr221/our-stages). Allow additional time for photography, meals and wet rock.

### 2.3 Alternative Itineraries

**Separate hiking days from holiday length.** Arrival and departure can consume two dates even when the flights are short. The trip-length column below includes one contingency/rest day where shown.

| Option | Walking plan | Hiking days | Sensible holiday length | Approximate walking | Effort and trade-off |
|---|---|---:|---|---|---|
| Short mountain core | Sóller → Tossals → Lluc → Pollença | 3 | 5–6 days | 53–58 km | Concentrated effort; misses Valldemossa and Deià |
| Compact highlights | Valldemossa → Deià → Sóller → Tossals → Lluc | 4 | 6–7 days | 55–64 km | Keeps the strongest central scenery; departure from Lluc needs planning |
| **Best one-week fit** | Above, then Pollença | **5** | **8 days / 7 nights** | **72–81 km** | Varied, with two demanding mountain days and one buffer day |
| **Best with a little more time** | Esporles → Valldemossa, then the five-day core | **6** | **9 days / 8 nights** | **81–91 km** | Shorter opening day and another village overnight |
| Extra terraces | Estellencs → Esporles, then the six-day plan | 7 | 10 days / 9 nights | 95–105 km | Adds Banyalbufar and Camí des Correu |
| Full route, brisk | Port d’Andratx → Port de Pollença | 8–9 | 10–12 days | About 150 km | Some combinations/long stages; fewer easy days |
| Full route, comfortably split | Split at Ses Fontanelles and Valldemossa; add a Sóller night after Muleta | 11–12 | 13–15 days | About 150 km plus approaches | More expensive and booking-intensive; better time for every section |

These are **my itinerary designs**, using the sections above, rather than official tour products. Ranges deliberately account for alternate town approaches.

**Concrete full-route sequences:**

- **Nine hiking days:** Port d’Andratx → Sant Elm → Estellencs → Esporles → Valldemossa → Deià → Sóller → Tossals → Lluc → Port de Pollença, passing through Pollença on the final day. That final day is about 24–26 km; stop in Pollença and add another day if tired. The Sant Elm–Estellencs day remains long.
- **Eight hiking days:** use the same sequence but combine Esporles–Valldemossa–Deià. This adds the official 23.2 km / ↑1,325 m day. I would choose the shorter central traverse for an eight-day holiday instead.
- **Twelve hiking days:** Port d’Andratx → Sant Elm → Ses Fontanelles → Estellencs → Esporles → Valldemossa → Deià → Muleta → Sóller → Tossals → Lluc → Pollença → Port de Pollença. Every arrow is one day. This requires a confirmed Ses Fontanelles stay; combining the final two walking days reduces it to eleven.

For a **genuinely gentler 7–8-night holiday**, reduce the mountain traverse instead of merely reducing its number of days:

1. Spend two nights around Esporles/Banyalbufar: walk Camí des Correu in one direction and use a bus for the other, subject to that day’s service.
2. Spend one night in Deià and walk to Sóller the next day.
3. Spend two nights in Sóller: choose a short Biniaraix/Fornalutx valley circuit or an out-and-back up part of the Barranc, turning around before fatigue builds.
4. Transfer to Lluc for one night and do a short woodland walk. Walk to Pollença only if a roughly 18 km day suits you; otherwise use transport.
5. Finish with a Palma night.

Aim for **6–12 km and 2–4 h** on most walking days by choosing local turnaround points. This is a GR221-based holiday with transfers, not a continuous traverse. **It omits the high pass and the full Sóller–Tossals climb.**

If you want the high mountains with less climbing, a confirmed bus/taxi to **Cúber** followed by a walk to Tossals can replace the long climb from Sóller. However, the next day to Lluc still has roughly **870 m ascent**. Transport to the reservoir does not make the entire mountain section easy.

### 2.4 Variants & Detours

| Change | Effect on route / effort | When it makes sense |
|---|---|---|
| Start in Esporles | Adds about 9–10 km and one day before Valldemossa | Best simple extension to the five-day core |
| Start in Estellencs | Adds another 14.4 km and one day | Best extra day for terraces and villages |
| Branch into Sóller town | Avoids sleeping at Muleta and walking its approach next morning | My default for balancing daily effort |
| Muleta overnight + extra Sóller night | Preserves sunset at Muleta, then adds a short transition/rest day | Good use of an extra night if refuge atmosphere matters |
| Cúber → Tossals via main route | Roughly 7–9 km, 2.5–3.5 h; final GPX required | Short mountain access day; skips the Biniaraix ascent |
| Pas Llis | Alternative from the Cúber area with a short exposed, chain-assisted passage | Experienced, confident hikers in dry conditions; not the default solo route |
| Sa Costera → Cala Tuent | Roughly 10–12 km from Mirador de ses Barques, longer from Sóller; boat/taxi needed at finish | An extra coastal day with confirmed return transport |
| Archduke circuit from Valldemossa | Local provider version: 11 km, ↑550 m, about 4 h | Stay two nights and choose the best-weather day; overlaps the traverse scenery |
| S’Arracó / Galatzó approaches | Alternative southwest entrances | Useful if fitting refuge beds or avoiding the longest southwest day |
| Castell d’Alaró / Orient branch | Changes the finish and overnight pattern; not a minor out-and-back | Worth a separate extension after the main booking chain is secure |
| Port de Pollença finish | Adds about 7 km, about 2 h | For a sea finish or full main-route completion |

Use the [official variants and mapping portal](https://caminsdepedra.conselldemallorca.es/en/dry-stone-route-gr-221), [Archduke circuit description](https://www.mallorcahiking.com/most-popular-tours/circuit-out-valldemossa-and-along-archdukes-bridleway/) and [Cala Tuent boat operator](https://www.barcoscalobra.com/). Distances for transport-assisted variants are planning ranges; confirm both the track and the transfer before booking.

**Do not substitute a summit or gorge for an ordinary GR221 stage without separate research.** In particular, the Torrent de Pareis is not a casual shortcut to the coast. For this first solo trip, the main-route high pass already provides a substantial mountain experience.

## 3. Difficulty & Trail Conditions

### 3.1 Physical Difficulty

The difficult part is repeated climbing and descending on stone with a loaded pack. The official **Muleta–Tossals day exceeds nine hours moving**, which is why the recommended itinerary starts that day in Sóller. The official combined **Esporles–Deià day has over 1,300 m ascent and descent**, so split it at Valldemossa. These are meaningful reductions in workload, not merely changes of lodging. [Council stage 6](https://caminsdepedra.conselldemallorca.es/en/-/etapa-6-muleta-tossals-verds), [Council stage 4](https://caminsdepedra.conselldemallorca.es/en/-/stage-3-esporles-can-boi).

Before committing, test two consecutive walking days with your intended backpack, including roughly **800–1,000 m ascent on one day**. The useful test is how your feet and knees feel the following morning. If that is currently too much, choose the gentler plan or reservoir access variant.

### 3.2 Technical Difficulty

The recommended main route is a walking trek, with rough limestone, cobbles, uneven steps and steep descents. It does not require planned climbing equipment in ordinary dry conditions. That does not mean every section is comfortable for someone with vertigo or poor footing.

Choose the **main route via Font des Noguer / Coll des Coloms** when approaching Tossals from Cúber; inspect the GPX for this choice. **Pas Llis is a distinct variant**, not an unavoidable obstacle. Local accounts describe a chain-assisted passage there. [Official variant list](https://caminsdepedra.conselldemallorca.es/en/dry-stone-route-gr-221), [Pas Llis route account](https://www.estilopalma.com/2024/12/tossals-verds-over-rough-and-smooth/).

### 3.3 Elevation

The central route rises from Sóller’s low valley to the roughly 900 m Coll de l’Ofre, drops to Tossals, then climbs again to the approximately 1,200 m high pass before descending to Lluc. There is little reason to worry about altitude acclimatization at these elevations; physical effort and weather are the issues. [DAV high-pass route](https://www.outdooractive.com/en/route/hiking-trail/balearen/mallorca-gr-221-stage-9-from-refugi-de-tossals-verds-to-refugi-son/15725571/).

### 3.4 Trail Condition

Expect maintained historical paths interspersed with rocky mountain trail, woodland tracks and road sections. Wet limestone and leaf-covered stone steps can materially slow your pace. Wind damage, erosion or exceptional snow can change usability.

📅 **Checked 12 September 2026:** the official Esporles–Can Boi description says the **Son Cabaspre urbanization section is passable but not signposted**. Some travel reports describe closure or land-access problems. Use the council’s current alignment, and confirm again before walking. A report that someone crossed a fence is not evidence of permission. [Official stage status](https://caminsdepedra.conselldemallorca.es/en/-/stage-3-esporles-can-boi).

## 4. Season & Weather

### 4.1 Hiking Season

✓ **Recommended:** retain late April. It offers a good balance between daylight, moderate lowland temperatures and staffed accommodation. It is already a popular hiking period. The route is not governed by one alpine-style opening date; each refuge and any high-weather restriction must be checked separately.

Local guides describe September through early June as the main walking period, while noting that April and May can still be hot. [Local seasonal guidance](https://www.mallorcahiking.com/most-popular-tours/circuit-out-valldemossa-and-along-archdukes-bridleway/).

### 4.2 Weather Patterns

For context, AEMET’s **1981–2010 Palma airport normals**, at only 5 m elevation, give April an average daily maximum **19.8°C**, minimum **7.4°C**, rainfall **34 mm**, and about **4.8 days with at least 1 mm rain**. These are old climate normals for a lowland station, **not a forecast or mountain climate measurement**. [AEMET station data](https://www.aemet.es/en/serviciosclimaticos/datosclimatologicos/valoresclimatologicos?k=bal&l=B278).

For packing, allow for warm walking in sheltered valleys, cold wind at exposed passes, rain and reduced visibility. Near-freezing conditions on high ground remain a contingency worth preparing for. Do not infer a snow-free high pass from a sunny Palma forecast. The exact weather for April 2027 is presently unknowable.

### 4.3 Seasonal Trade-offs

| Period | Main advantage | Main compromise |
|---|---|---|
| March–April | Cooler walking, spring growth | Rain/wind, occasional high-ground winter conditions; popular refuge dates |
| May | Longer daylight, generally warmer | Greater heat and water demand |
| June–August | Long days | Heat makes exposed multiday walking much less attractive |
| September–October | Warm sea and a second hiking season | Heat can linger; rain and storms require flexibility |
| November–February | Quiet villages and cooler days | Shorter daylight and more limited services; mountain weather |

This comparison is a planning synthesis. For decisions, use [AEMET forecasts](https://www.aemet.es/en/eltiempo/prediccion) and [AEMET warnings](https://www.aemet.es/en/eltiempo/prediccion/avisos), selecting Mallorca/Serra de Tramuntana and the relevant towns. A storm day is a reason to change the route, not to use the buffer day as pressure to push through.

## 5. Navigation & Route Finding

### 5.1 Waymarking

Follow GR signs and red-and-white route markings, while checking each junction against your downloaded map. Old reports of long unsigned southern sections predate improvements; conversely, a general claim that the whole route is signed does not remove the specific Son Cabaspre caveat. [Council route overview](https://caminsdepedra.conselldemallorca.es/en/dry-stone-route-gr-221), [local route updates](https://gr221.info/news.htm).

### 5.2 Maps & Digital Navigation

| Resource | Best use |
|---|---|
| [Official hiking map viewer](https://www.conselldemallorca.info/mediambient/pedra/senderisme/index_ca.html) | Confirm main route, variants and their status |
| [Official July 2026 PDF map](https://caminsdepedra.conselldemallorca.es/documents/995858/996207/fulleto_ruta_pedra_sec_A3.pdf/ef144427-463a-db66-86dc-dbc397734962?t=1784205709571) | Whole-route orientation; not a detailed terrain map |
| Council stage pages linked in §2.1 | Each retrieved stage page includes a GPX download link |
| [Komoot central-stage collection](https://www.komoot.com/collection/2235396/-an-alternative-to-magaluf-the-gr221-mallorca) | Compare custom stage endpoints; check against official access |
| [DAV/Outdooractive high-pass description](https://www.outdooractive.com/en/route/hiking-trail/balearen/mallorca-gr-221-stage-9-from-refugi-de-tossals-verds-to-refugi-son/15725571/) | Terrain and route explanation; its historical bus numbers are obsolete |

A current detailed Tramuntana paper map is a useful backup. Check that it covers the central and northern sections; an island tourist road map is insufficient. No particular paid map edition was verified during this research.

### 5.3 Navigation Preparation

Download your **exact** daily GPX, offline terrain maps, refuge pins and escape points. Include the Sóller-town branch and the chosen Cúber–Tossals approach. Test that maps and tracks remain visible in airplane mode.

Save reservation confirmations and bus information offline too. The official overview map is useful for planning, but it cannot resolve every rocky junction. Carry a small paper backup or printed route extracts and know how to identify your coordinates.

## 6. Accommodation & Overnight Planning

### 6.1 Accommodation System

The route combines council refuges with independently operated hostels, guesthouses and hotels. **They do not all use the same booking system.** A Spanish *hostal* may offer private rooms rather than backpacker dormitories.

| Place | Booking route | Role in your plan |
|---|---|---|
| Valldemossa | [Ca’s Papà official website](https://www.hotelcaspapa.com/en/home.html), or another village property | Practical trail start; expect a private-room budget |
| Deià | [Can Boi official refuge information](https://caminsdepedra.conselldemallorca.es/en/-/can-boi-4) and council portal | Good inexpensive/social overnight |
| Sóller town | [Hostel Sóller](https://hostelsoller.com/) or [Hostal Nadal](https://www.hostalnadalsoller.com/en/) | Best location before the long climb; confirm room type |
| Muleta | Council portal | Scenic refuge near Port de Sóller; different logistics from town |
| Tossals Verds | [Council refuge information](https://caminsdepedra.conselldemallorca.es/en/refugi) and portal | Remote overnight anchoring the mountain section |
| Lluc / Son Amer | Council portal for Son Amer; [Lluc monastery](https://www.lluc.net/es/) separately | Dormitory versus private-room choice |
| Pollença | Council portal for Pont Romà, or town hotel | Convenient trekking finish |
| Esporles | [S’Hostal d’Esporles listing](https://www.booking.com/hotel/es/sa-hostal-da-esporles.html) | Extra opening stage; verify cancellation and arrival terms |
| Ses Fontanelles | [Owner’s enquiry page](https://www.ses-fontanelles.es/en/) | Southwest stage split; privately booked |

These are **practical candidates, not confirmed availability or a hotel-quality ranking**. Ses Fontanelles currently advertises private double rooms; do not assume the old dormitory configuration described in hiking blogs still applies.

### 6.2 Booking Strategy

**Book the bed chain around Tossals Verds.** It has fewer convenient substitutes than Sóller, Deià or Pollença. Solo travel helps when a single bed remains, but does not remove the need to reserve.

Use the [official council booking portal](https://seu.conselldemallorca.net/refugis/en/dispo/llistat/). It includes a **route availability search**, in addition to individual refuge/date searches.

1. Prepare your preferred itinerary and one alternative with dates shifted by a day or the direction reversed.
2. Search **one adult**, exact arrival date, and departure the following day. Check whether you are buying a dormitory bed or a room.
3. Check Tossals first, then Can Boi, Son Amer and Pont Romà as applicable. Secure town stays around the workable refuge sequence.
4. Select meals and linen deliberately. At Tossals, include dinner and arrange the next day’s lunch; ask how early breakfast can be provided if needed.
5. Before paying, read the displayed cancellation/refund rules, payment deadline, remaining balance and amendment procedure. Save the complete confirmation.
6. If the system cannot handle your request, use the council’s published contact: **+34 971 173 700**, **xarxaderefugis@conselldemallorca.net**. No enquiry has been sent on your behalf.

📅 **Official booking window checked 12 September 2026:** generally **four months to five days before arrival**. Closer bookings may be possible by phone or at the refuge if places remain. Blogs disagree about “130 days”; the official rule does not specify that or a guaranteed release hour. [Council booking procedure](https://seu.conselldemallorca.net/es/ficha?key=6313), [published refuge regulation](https://caminsdepedra.conselldemallorca.es/documents/995858/12336898/20180928_reglament.pdf/760f5323-1cf8-776c-6aef-0423b6452066?t=1710941107517).

For the **seven-night itinerary in §13.1**, the four-calendar-month rule implies these dates. **They are calculated planning dates, not verified system release appointments.**

| Night required | Property | Expected booking-window date |
|---|---|---|
| 22 April 2027 | Can Boi | Around 22 December 2026 |
| 24 April 2027 | Tossals Verds | Around 24 December 2026 |
| 25 April 2027 | Son Amer, if chosen | Around 25 December 2026 |
| 26 April 2027 | Pont Romà, if chosen | Around 26 December 2026 |

Start checking the portal’s calendar in early/mid-December. The holiday-period release dates make checking the online workflow in advance useful. If nights open separately, reserve earlier scarce beds as they become available while keeping later town stays flexible; do not wait for the last date to open without checking the earlier ones.

**Private-room limits:** Tossals’ two-bed room is booked **by email**, according to the refuge page. It is only one room and not a reliable sole plan. If private sleeping every night is essential, either secure it or replace the remote overnight with transport-assisted day walks. [Tossals booking instruction](https://caminsdepedra.conselldemallorca.es/en/refugi).

**Unresolved:** no reliable current, universal refund percentage or deposit rule was verified for all council properties. The often-repeated “80% deposit” is not treated here as a guaranteed 2027 condition. Use the exact terms on your reservation; cancellation terms from tour companies do not govern direct refuge bookings.

### 6.3 Overnight Logistics

Council regulations state April arrival/registration **before 19:00**, dormitory access from **16:00**, departure before **10:00**, and use of sheets or a sleeping bag. These are distinct from the later nightly door-closing time. **Plan to arrive well before 19:00.** [Refuge regulation](https://caminsdepedra.conselldemallorca.es/documents/995858/12336898/20180928_reglament.pdf/760f5323-1cf8-776c-6aef-0423b6452066?t=1710941107517).

Tossals lists showers, hot water, electricity, heating and Wi-Fi. Its posted meal times are breakfast **08:00–09:00** and dinner **20:30**. Confirm early-start arrangements rather than assume a 06:30 breakfast. Linen/towels cost extra on the published tariff. [Tossals facilities](https://caminsdepedra.conselldemallorca.es/en/refugi).

Ask each property about potable water, charging, towel/linen inclusion, dietary needs and next-day packed lunch. Do not assume laundry facilities or reliable drying overnight. Bring earplugs and keep valuables with you.

### 6.4 Camping

For one backpack and this itinerary, **indoor accommodation is the simpler plan**. A tent adds weight and does not solve the uneven spacing of authorized overnight sites.

IBANAT operates designated camping at **Sa Font Coberta and Es Pixarells** around Lluc. Its page specifies online reservations and labels their water points **non-potable**. These are specific campsites, not a general right to camp along the GR221. [Official campsite information and reservations](https://caib.es/sites/ibanat/ca/acampades_ibanat/).

I did not establish a single regulation that conclusively resolves every proposed bivouac location across public land, private estates and protected zones. Do not infer permission from camping blogs or assume “no tent” bypasses restrictions. Obtain permission from the relevant manager for any camping variant.

## 7. Food, Water & Resupply

### 7.1 Water

💧 **Plan around confirmed potable supplies at overnight stops.** A spring name on a map does not prove it is flowing or safe. April 2027 spring reliability cannot be established now.

Carry capacity for **at least 3 L**. As a planning starting point, carry about **2–3 L on ordinary days**, and assess more for long, warm mountain days according to your consumption and the forecast. Ask the host the evening before about the next day’s supply. Bottled water may be the fallback if a refuge’s tap supply is unsuitable.

| Section | Water plan |
|---|---|
| Estellencs–Esporles | Fill at departure; Banyalbufar is a possible commercial refill, not a guaranteed fountain |
| Valldemossa–Deià | Start with the whole day’s requirement |
| Deià–Sóller | Carry a day supply even if a café stop is planned |
| Sóller–Tossals | No dependable staffed refill after leaving the valley; verify at departure |
| Tossals–Lluc | Carry the whole day’s water; confirm Tossals supply before leaving Sóller |
| Lluc–Pollença | Carry a full day supply; treat incidental fountains as unverified |

A filter can reduce some microbial risks but does not make contaminated water universally safe or make a dry spring useful. Use confirmed drinking water first. Local guide advice emphasizes carrying water even outside summer. [Route-specific guide advice](https://www.mallorcahiking.com/most-popular-tours/circuit-out-valldemossa-and-along-archdukes-bridleway/).

### 7.2 Food

Village stays offer restaurants and shops; mountain days require advance supplies. Lluc advertises catering and a bakery/shop, but selection and hours need checking. [Lluc services](https://www.lluc.net/es/).

For the two-day Sóller–Tossals–Lluc crossing: buy the first lunch and snacks in Sóller, reserve dinner/breakfast at Tossals, and arrange a packed lunch there or carry a second lunch. Keep one extra substantial snack/meal for delay. There is no need to carry a week’s food.

If you want to keep a specific diet during the trip, confirm what the refuge can actually provide before paying for meals. Do not assume a fixed communal menu or packed lunch can be adapted on arrival.

### 7.3 Resupply Strategy

**Sóller is the last major resupply before the mountain pair.** Use the easier Deià–Sóller day to shop, sort your pack and confirm the next refuge’s meal/water arrangements. Refuel at Lluc; return to broader choice in Pollença. This sequence avoids both an overloaded pack and an unplanned food gap.

Business opening times, Sunday service and holiday hours for April 2027 remain unverified. Buy essentials the preceding afternoon whenever possible.

## 8. Access & Transportation

### 8.1 Reaching the Route

Fly to **Palma de Mallorca Airport (PMI)**. The airport operator lists **EMT A1 to Palma centre**; use the Plaça d’Espanya / Estació Intermodal area to connect with island buses. [Airport bus information](https://www.aena.es/en/palma-de-mallorca/getting-there/bus.html).

The following route numbers are planning references from the currently indexed TIB network, **not verified April 2027 timetables**:

| Need | Route to check |
|---|---|
| Palma → Estellencs / Banyalbufar / Esporles | [TIB 202](https://www.tib.org/en/linies-i-horaris/autobus/-/linia/202) |
| Palma → Valldemossa / Deià / Sóller corridor | [TIB 203](https://www.tib.org/en/linies-i-horaris/autobus/-/linia/203) |
| Palma → Sóller / Port de Sóller | TIB 204 via the [official network planner](https://www.tib.org/en/linies-i-horaris) |
| Palma → Port d’Andratx for the full route | Check TIB 101 in the same planner |

Aim to reach your first village without a same-day mountain hike. If the flight arrives late, sleep in Palma and transfer the next morning; shorten the trek if necessary rather than race sunset.

### 8.2 Leaving the Route

From Pollença or Port de Pollença, check **TIB 301 to Palma**, then A1 to PMI. If finishing at Lluc, investigate **312 toward Inca** with onward train/bus, or **231** through the mountains when operating. [TIB network](https://www.tib.org/en/linies-i-horaris), [301 route](https://www.tib.org/en/linies-i-horaris/autobus/-/linia/301).

For a morning flight, a last night in Palma is the most forgiving arrangement. I would not schedule a mountain walk and a flight on the same day.

### 8.3 Along-the-Route Transport

TIB **231** is particularly useful: the operator’s indexed stop list includes **Sóller, Mirador de ses Barques, Cúber, Lluc and Pollença**. Its service period and frequency must be checked for your date; some live English pages returned incomplete content during research. [TIB 231 stop list](https://www.tib.org/de/linies-i-horaris/autobus/-/linia/231).

| Adjustment | Practical use | Limitation |
|---|---|---|
| Bus between western villages | Skip a tired/rainy day | Sparse or changed service can defeat a tight schedule |
| Bus/taxi Sóller → Cúber | Reduce mountain ascent | Must confirm service, especially on 24 April |
| Tram/bus Port de Sóller → Sóller | Shorten the approach after a Muleta overnight | Adds transfer time; check first departures |
| Cala Tuent → Port de Sóller boat | Complete a Sa Costera day | Sea state and seasonal schedule; arrange before walking |
| Taxi from a road-accessible village | Recover from missed bus or illness | Solo traveler pays the whole fare; request an actual quote |

The [Cala Tuent operator](https://www.barcoscalobra.com/) advertises crossings, but that is not confirmation of an April 2027 departure. Avoid walking into an isolated finish expecting an unbooked boat or taxi.

### 8.4 Pre- and Post-Trek Logistics

With one backpack, you do not need a luggage-transfer service or a return to your starting hotel. An open-ended traverse works well with buses. Choose the final Palma accommodation for convenient airport access.

Check your airline’s actual pack dimensions and rules for trekking poles before choosing cabin-only travel. Airline-specific baggage policy and flights from Israel were not researched, so no fare or direct service is assumed.

## 9. Safety & Risk Management

### 9.1 Main Hazards

The relevant risks are slips on stone, fatigue late in a long descent, dehydration, sudden wind/rain and navigation errors in cloud. Road crossings and road-side sections need attention too.

For a solo trip, use conservative weather decisions on **Valldemossa–Deià** and **Tossals–Lluc**. A shorter itinerary does not reduce the difficulty of a particular exposed section. Skip Pas Llis if its exposure exceeds your comfort; avoid adding remote side routes merely because they look close on a map.

### 9.2 Emergency Planning

**Emergency number: 112.** Give your coordinates, route section, nearest landmark and injury/condition. Follow the operator’s instructions. Mobile reception is not continuous; Ses Fontanelles explicitly reports no cellular reception at the property, illustrating why offline preparation matters. [Spain health/emergency guidance](https://www.gov.uk/foreign-travel-advice/spain/health), [Ses Fontanelles](https://www.ses-fontanelles.es/en/).

Share each day’s destination with a trusted contact, agree when they should act if you fail to check in, and send any route change while you still have signal. A satellite communicator is an optional additional layer if you already use one, not a substitute for weather judgment.

### 9.3 Bailout & Escape Options

| Where you are | Best planning option |
|---|---|
| Estellencs / Banyalbufar / Esporles / Valldemossa / Deià | End at a village and use confirmed bus/taxi or stay overnight |
| Sóller / Biniaraix before the main climb | Return to the valley; this is an easy decision point before committing |
| Cúber / Font des Noguer road corridor | Prearranged pickup or an operating scheduled bus; avoid walking the main road as a fallback |
| Tossals Verds | Ask staff about the suitable route out; Son Ordines road access is reached on foot, not by a taxi at the refuge door |
| High pass between Tossals and Lluc | No immediate vehicle extraction point; route choice depends on location and conditions |
| Lluc / Son Amer | Road access, lodging alternatives and transport options |
| Lower Pollença valley | Roads become closer, but a bus stop and service must still be verified |

The refuge describes the walk from Son Ordines parking as about **one hour**; allow for your condition and the actual pickup point. [Official Tossals access](https://caminsdepedra.conselldemallorca.es/en/refugi).

### 9.4 Health & Insurance

For this Mallorca itinerary, ordinary hiking health measures and routine vaccine records matter more than specialized travel vaccination. Review records with a travel-health clinician if uncertain; individual vaccine history is unknown.

| Topic | Trip-specific action |
|---|---|
| Routine protection | Verify MMR, tetanus/diphtheria/pertussis and polio; review other routine eligibility under your own schedule |
| Measles | Mallorca reported 29 confirmed cases in a July 2025 bulletin. This supports checking immunity, not predicting an April 2027 outbreak |
| Hepatitis A | Discuss if not immune. CDC advises consideration for most Spain travelers and recommends it for relevant rural/village exposures; UK guidance does not make the same general recommendation |
| Hepatitis B | Review records and exposure. CDC recommends it for unvaccinated travelers under 60; the walking itinerary itself adds little specific blood/sexual exposure |
| Rabies | No routine pre-exposure indication identified for ordinary hiking/refuge stays; avoid bats and seek prompt care after possible exposure |
| Entry certificates | UK destination guidance currently lists no IHR certificate requirement for Spain; recheck your final transit itinerary |

Sources: [CDC Spain, reviewed 25 August 2026](https://wwwnc.cdc.gov/travel/destinations/traveler/none/spain), [TravelHealthPro Spain](https://travelhealthpro.org.uk/countries/spain), [Mallorca measles bulletin, 4 July 2025](https://www.caib.es/sites/epidemiologia/es/inicio-9268/archivopub.do?ctrl=MCRST337ZI518203&id=518203). The CDC/UK difference is preserved rather than presented as a uniform international recommendation.

**TBE assessment — very low concern for this trip; vaccination usually not indicated by Mallorca alone.** Spain’s national epidemiology centre describes Spain as non-endemic, with no detected locally acquired cases and only sporadic imported cases, while acknowledging tick-vector presence. CDC’s endemic-area vaccination framework does not make vegetation exposure alone an indication. **Confidence: High** for present national classification; **Medium** for a fine-scale Mallorca/April 2027 prediction. [ISCIII/CNE TBE](https://cne.isciii.es/en/servicios/enfermedades-transmisibles/enfermedades-a-z/encefalitis-transmitida-garrapatas), [CDC TBE guidance](https://www.cdc.gov/yellow-book/hcp/travel-associated-infections-diseases/tick-borne-encephalitis.html).

Use ordinary tick precautions: label-directed repellent, minimize brushing vegetation, inspect skin daily using a phone/mirror for your back, and carry fine-tipped tweezers. This assessment does not mean Mallorca has no ticks or other tick-borne infections.

Carry blister/wound supplies and regular medicines; plan hydration and enough food for each day. Verify insurance covers **solo multiday hiking, your route’s terrain/elevation, medical care, mountain rescue/evacuation and repatriation**. Do not assume an Israeli resident has EHIC/GHIC eligibility or that every rescue is free. [Spain health and insurance guidance](https://www.gov.uk/foreign-travel-advice/spain/health).

## 10. Rules, Access & Trail Management

### 10.1 Access Requirements

No general GR221 hiking permit or trail entry fee was identified for the public main-route itinerary. Refuges require separate reservations. Private-estate detours may have their own permission systems.

**Muntanya del Voltor:** some popular Archduke-path approaches enter this managed area and require advance permission. A recent detailed hiking guide gives **info@muntanyadelvoltor.com** and **+34 619 591 985** for requests. Its reported quota/release practices should be reconfirmed directly; the manager’s website could not be retrieved. The official GR221 description uses the **Coma des Cairats** side, so do not assume every Valldemossa–Deià track has identical permit requirements. [Permit and map explanation](https://www.moonhoneytravel.com/path-of-the-archduke-mallorca/), [official stage description](https://caminsdepedra.conselldemallorca.es/en/-/stage-3-esporles-can-boi).

### 10.2 Regulations

Remain on authorized paths, obey local closure signs and respect private property. Use designated overnight locations, carry rubbish out and do not light fires or cook outside permitted areas. Refuge house rules apply separately from trail access. [Council refuge regulations](https://caminsdepedra.conselldemallorca.es/documents/995858/12336898/20180928_reglament.pdf/760f5323-1cf8-776c-6aef-0423b6452066?t=1710941107517), [IBANAT campsites](https://caib.es/sites/ibanat/ca/acampades_ibanat/).

No drone, dog or wild-camping activity is included in this plan; their location-specific permissions were not established. If adding one, check the relevant authority rather than reuse a general GR221 answer.

### 10.3 Trail Etiquette

Use gates/stiles, leave gates as found, avoid climbing dry-stone walls and do not pick produce from estates. Keep noise low near houses and wildlife. At refuges, use the designated boot/gear area, respect sleeping neighbors and prepare the next morning’s bag without disturbing the dormitory.

## 11. Gear & Packing

### 11.1 Route-Specific Gear Strategy

Use a **roughly 30–36 L backpack** for indoor nights, provided your gear fits comfortably. Carry weather protection and daily food/water, with a small reserve. A tent, sleeping mat and stove add little value to this booked-refuge plan.

### 11.2 Footwear

Prioritize wet-rock grip, a secure heel, toe room and enough underfoot protection for hours of stone. Given your preference for wide, non-waterproof footwear, a proven trail shoe can fit this trip; test it on repeated rocky descents with a loaded pack. Do not choose a thinner sole simply to save a few grams if stones already tire your feet. Specific shoe models were not compared here.

### 11.3 Clothing & Layering

A light walking layer, trousers, fleece, warm evening layer, wind/rain shell, spare dry socks and a dry sleep layer form a useful system. Add a warm hat and light gloves for exposed weather. Keep the spare clothing compact rather than carry a fresh outfit for every day.

### 11.4 Rain & Weather Protection

Carry a hooded waterproof shell and protect the contents with a pack liner/dry bags. Include rain trousers if your forecast and cold tolerance justify them. Sunglasses, a sun hat and sunscreen remain useful in April. A pack cover alone does not reliably keep bedding and electronics dry.

### 11.5 Sleeping & Accommodation Gear

Bring a liner or rent sheets where accepted; confirm bedding/blanket provision at **every** booked property before leaving a sleeping bag at home. Earplugs, a small towel or towel rental, and lightweight indoor footwear are useful. Sleeping requirements are a booking question, not something to infer from a photo of a made-up bed.

### 11.6 Food & Water Equipment

Carry two or more containers totaling at least 3 L, compact lunch storage and a reusable utensil if needed. Water-treatment equipment is optional backup; it does not replace potable-water planning. No cooking kit is needed when meals are arranged.

### 11.7 Navigation, Electronics & Charging

Use your phone with offline maps, an approximately **10,000 mAh battery bank**, charging cable and a compatible European two-pin charger. Adjust battery capacity to your device and screen use. Keep the map available when reception drops.

### 11.8 Safety & Emergency Equipment

Pack a headlamp, whistle, emergency bivy/blanket, blister kit, small first-aid supplies, personal medication, tweezers and minimal repair tape. Poles are useful for repeated descents if you already use them. Stow them when hands are needed on rough passages.

### 11.9 Pack Weight

My planning target is **5–7 kg before food and water**, approximately **8–11 kg when loaded for a mountain day**. This is a realistic target range, not a safety threshold. Weigh the actual setup. Reduce duplicate clothes, large toiletries and unnecessary cooking/camping equipment before cutting rainwear or water capacity.

## 12. Costs & Practicalities

### 12.1 Trek Budget

📅 **Published tariff checked 12 September 2026; 2027 prices unconfirmed.** Tossals lists an adult dorm bed **€14**, breakfast **€5.50**, dinner **€9.50**, picnic **€8**, linen **€4.50**, towel **€2**. Bed + breakfast + dinner is **€29**; adding picnic and linen makes **€41.50**. Do not assume every independent hostel uses this tariff. [Official tariff](https://caminsdepedra.conselldemallorca.es/en/refugi).

The following are **budget allowances I propose**, not live quotes. Private-room prices can be higher during the cycling-event week.

| Style | Accommodation + meals allowance per day | Seven-night / eight-day ground budget |
|---|---:|---:|
| Economy, mostly dorms; limited private-room nights | €50–80 | About €500–800 |
| Mixed refuges and private rooms | €85–130 | About €800–1,250 |
| Private rooms wherever possible | €140–210+ | About €1,300–1,900+ |

Totals include a planning allowance for local transport, snacks and small incidentals. **Flights, insurance, new equipment and substantial emergency spending are excluded.** Private-room travel cannot be guaranteed at Tossals. Keep a separate contingency reserve for a taxi or an extra hotel night.

For an eighth night, allow roughly another **€60–150**, depending on where you stay. Ask private properties for the total for **one adult**, including any applicable local tax, meals and cancellation conditions.

### 12.2 Money

Use euros. Carry a bank card and around **€100–150 in small cash notes** as a flexible allowance. Reconfirm how each refuge accepts the balance. Obtain cash in Palma or a larger town before the remote section rather than expect an ATM at a refuge.

TIB publishes a bank-card travel option; check its current validation instructions and use the same payment medium consistently. Do not assume an island resident’s free-travel entitlement applies to a visitor. [TIB bank-card guide](https://www.tib.org/en/bitllets-i-tarifes/targeta-bancaria).

### 12.3 Connectivity

Plan for mobile gaps. Wi-Fi at an accommodation does not establish coverage on its approach. Ensure your Israeli mobile plan or eSIM covers Spain, and download maps before travel. Network-by-network mountain coverage was not verified.

### 12.4 Everyday Practicalities

Use village toilets and accommodation facilities before long sections. Carry a small waste bag and tissues. Wash small items only where permitted and do not rely on them drying overnight. A private room in Sóller is a useful chance to reorganize, dry equipment and sleep well before the mountain pair.

## 13. Planning the Trek

### 13.1 Recommended Itinerary

**My first choice: 21–28 April 2027 — eight calendar days, seven nights, five hiking days and one flexible day.** This is a partial GR221 traverse that prioritizes the central sections. Estimated stage figures are planning ranges; finalize the exact route after securing beds.

| Date | Plan | Walking / effort | Overnight |
|---|---|---|---|
| Wed 21 April | Arrive PMI; transfer to Valldemossa, or Palma if late | Travel only | Valldemossa preferred |
| Thu 22 April | Valldemossa → Deià | 12–14 km; ↑600–750 m, ↓900–1,000 m; 4.5–6 h | Can Boi or Deià room |
| Fri 23 April | Deià → Sóller town | 10–12 km; ↑300–400 m, ↓400–550 m; 3–4 h | Sóller |
| Sat 24 April | Sóller → Tossals via Biniaraix and main route | 20–23 km; ↑1,000–1,100 m, ↓500–600 m; 6.5–8 h | Tossals Verds |
| Sun 25 April | Tossals → Lluc / Son Amer | About 15 km; ↑850–900 m, ↓850–900 m; 5.5–6.5 h | Son Amer or Lluc room |
| Mon 26 April | Lluc / Son Amer → Pollença | 17.5–19 km; ↑190–300 m, ↓680–800 m; 5–6 h | Pollença |
| Tue 27 April | Contingency/rest; optional sea visit if all went to plan | Keep optional | Palma |
| Wed 28 April | Airport and departure | Travel only | — |

**Why this ordering:** Deià–Sóller gives a lighter day before the longest climb, the major mountain days remain separate, and you finish somewhere with easier onward transport. The event on 24 April makes a walking departure from Sóller useful, but **check crossings of Ma-10 and race instructions**; do not assume pedestrian passage at any moment. Bad weather still overrides the itinerary.

**My second choice: 21–29 April — nine days, eight nights, six hiking days.** Arrive in Esporles on 21 April; walk to Valldemossa on 22 April, Deià on 23 April, Sóller on 24 April, Tossals on 25 April, Lluc on 26 April, and Pollença on 27 April. Keep 28 April flexible and sleep in Palma; depart 29 April. This buys a gentler start, and the cycling-event date falls on the lower Deià–Sóller walk.

**If you have nine nights:** add Estellencs before Esporles, or add a second Sóller night. Choose Estellencs for more continuous trail; choose Sóller for recovery and weather flexibility. I would not automatically spend that extra day on a summit.

### 13.2 Reservations & Timeline

| When | What to do |

| Now–November 2026 | Choose seven or eight nights; compare flight arrival times; check refundable village rooms around 24 April |
| Early/mid-December | Inspect the council portal, confirm the release rule, prepare alternative dates and a lodging list |
| Around 22–26 December for seven-night plan | Book the refuge dates as they enter the four-month window; prioritize Tossals within the available sequence |
| Around 23–27 December for eight-night plan | Corresponding refuge-window dates are one day later |

Key links: [Council bookings](https://seu.conselldemallorca.net/refugis/en/dispo/llistat/), [Hostel Sóller](https://hostelsoller.com/), [Lluc monastery](https://www.lluc.net/es/), [Valldemossa room candidate](https://www.hotelcaspapa.com/en/home.html), [TIB](https://www.tib.org/en/linies-i-horaris), [Mallorca 312](https://mallorca312.com/en/).

For each reservation record: date, exact address, bed/room type, meals, linen, amount paid, balance, cancellation deadline, arrival deadline and contact number. If any provider changes, recalculate that day’s start/end walking distance.

### 13.3 Travel Plan

Use PMI–Palma–Valldemossa/Esporles for arrival and Pollença–Palma–PMI for departure. Keep the whole kit in your one backpack. The final Palma night removes dependence on an early mountain bus.

A late arrival on 21 April uses some flexibility: either start from Valldemossa on 22 April after an early confirmed transfer, move the sequence by one day if beds permit, or shorten at Lluc. Do not make a fixed flight assumption when booking your first refuge.

### 13.4 Contingency Planning

| Problem | Workable response |
|---|---|
| Tossals full | Shift dates, reverse direction if the whole bed chain works, or use Cúber-based day walking; do not simply combine Sóller–Lluc into one day |
| Can Boi full | Compare Deià rooms; alternatively use a confirmed transfer and revise the walking sequence |
| Son Amer full | Check Lluc monastery directly |
| Long Sóller climb feels too much | Arrange Cúber transport on a suitable non-disrupted day; retain a proper plan for the following high-pass day |
| Bad ridge/high-pass weather | Stay in town or use transport to a lower area; notify booked accommodation about arrival changes |
| Sore feet | Shorten at a village/road access point and use the buffer day for recovery |
| Boat cancelled | Do not start a one-way Cala Tuent walk without an alternative return arrangement |
| Missed bus | Check the next real departure; request taxi quote or stay overnight |

**A spare day at the end protects your flight; it does not automatically move non-refundable refuge bookings.** Real weather flexibility may mean forfeiting a bed and skipping a section. Budget for that possibility.

## 15. Route-Specific Considerations

### 15.1 Special Characteristics

**Accommodation geography controls effort.** Muleta, Port de Sóller and Sóller town are not interchangeable. Likewise, Son Amer and the monastery are different buildings. A bed that looks close on an island map can add a meaningful walk to an already long day.

**Continuity has a price.** The full southwest adds good scenery, but fitting it into a week pushes you toward long stages or transport. For your stated priorities, I would preserve the central mountain pair and time in Valldemossa/Deià before chasing the complete mileage.

### 15.2 Local Knowledge

## 16. Research Sources & Confidence

### 16.1 Research Method

Researched through live web sources on **12 September 2026**. Official route stages, council accommodation rules, operator information, weather normals and dated firsthand accounts were compared before constructing the itineraries. Two specialist health checks covered general European travel vaccination and local TBE evidence; their results agree on the limited TBE relevance of this Mallorca trip.

Route designs, budget allowances, pack targets and recommendations are the report’s planning judgments. No availability request, payment, enquiry or booking was submitted.

### 16.2 Source Hierarchy

|---|---|
| Trail identity, stage measurements, access | Consell de Mallorca |
| Bed system, facilities and terms | Council rules and the accommodation operator |
| Bus/boat operation | TIB, Aena and the boat operator |
| Weather | AEMET |
| Disease and vaccine relevance | Spanish/Balearic public health, CDC and TravelHealthPro |

### 16.3 Source Recency

All listed sources were accessed or checked on **12 September 2026**. The official map is dated **July 2026**; the council still links regulations published in **2017**. Climate normals cover **1981–2010**. Some DAV route descriptions retain a **2018** access/transport context. Those older details were not adopted as current.

Where a page displays an update date but not a walk date, the report does not treat the update as proof that the author recently walked it.

### 16.4 Cross-Verification

The council’s Muleta–Tossals day is 27.8 km; DAV gives 27.8 km, while a Komoot variant gives 25.3 km. Different routing explains why “the stage” can appear shorter online. The report recommends a Sóller start and labels its metrics as ranges.

For high-pass effort, the council’s 15.1 km/869 m ascent and DAV’s 15.1 km/820 m ascent broadly agree. Their difficulty labels differ, so the recommendation uses the measured climbing and terrain rather than treating a rating as universal.

### 16.5 Confidence Ratings

#### High Confidence

Official route identity; the quoted retrieved stage figures; the existence of the council booking portal; published four-month rule; the announced **24 April 2027** cycling event; current Spanish non-endemic TBE classification.

#### Medium Confidence

Custom daily metrics before final GPX selection; predicted accommodation pressure; which sections will best suit you; the broad budget; future public-transport usefulness; the fine-scale TBE assessment.

#### Low Confidence

Any precise April 2027 weather, water, snow, closure, price or availability claim. No such precise claim is presented as confirmed.

### 16.6 Confidence in Recommendations

The five-day core is a strong fit if you enjoy mountain walking and can manage consecutive ascent/descent days. The six-day version is preferable if you want a gentler opening and an extra village. Whether either is comfortable depends on your tested pace, pack and feet; the gentler hybrid exists for a meaningfully lower workload.

### 16.9 Conflicts, Unknowns & Verification List

| Conflict / unknown | How this report handles it |
|---|---|
| 130/140/150 km route totals | Uses current council identity, with custom walking ranges |
| 150.1 versus 150.2 km official total | Reports approximately 150 km; does not claim false precision |
| Differing stage numbers | Uses place names; old URLs retain earlier numbers |
| Four months versus 130-day booking claims | Prioritizes official four-month rule; release hour unverified |
| Son Cabaspre closure claims versus council “passable” | Uses official wording but requires a fresh access check |
| “All refuges use the council portal” | Explicitly separates private operators and Lluc monastery |
| “Easy trail” versus demanding daily profiles | Separates physical effort, technical obstacles and itinerary length |
| Hepatitis recommendations differ internationally | States the CDC/UK difference and asks for record-based clinical review |
| Future schedules and inventory | No invented departures, prices, available beds or all-clear claims |

### 16.10 Research Freshness

**Research date: 12 September 2026. Intended trip: from 21 April 2027.** Refresh booking rules around December 2026, transport/event arrangements when spring schedules appear, and route status, weather, water and health notices shortly before departure. The most durable planning recommendation is the structure: **five-day central traverse, Sóller-town overnight before Tossals, separate high-pass day, and a final travel buffer**.

class DocumentParser {

   const t=tokens[i];

    const level=Number(t.tag.slice(1)),title=plainText(tokens[i+1]),id=uniqueSlug(title,headingSlugs);t.attrSet('id','heading-'+id);
