<script id="markdown-source" type="text/plain"># Tour des Glaciers de la Vanoise

## 1. Route Overview

### 1.1 Identity & Geography

📍 **Where:** Parc national de la Vanoise (PNV), Savoie (73), Auvergne-Rhône-Alpes, France. A hut-to-hut loop around the Vanoise glacier cap, between the Tarentaise valley (Pralognan-la-Vanoise) and the Haute-Maurienne (Aussois, Termignon/Val-Cenis).

**Interpretation used in this report:** the park offers the tour "à la carte". Its 2025 route sheet calls the **Col d'Aussois loop the "classique" route**, and the longer loop via the Col de Chavière and Refuge de l'Orgère the "Grand tour" ([PNV route sheet, May 2025](https://www.vanoise-parcnational.fr/sites/vanoise-parcnational.fr/files/2025-05/Fiche%20rando%20Tour%20des%20glaciers%20de%20la%20Vanoise.pdf)). The park's 2024 sheet and Pralognan tourist office pages still present the 7-day Chavière loop as the "circuit de base" ([PNV 2024 sheet](https://vanoise-parcnational.fr/sites/vanoise-parcnational.fr/files/2024-06/Tour%20des%20Glaciers%20de%20la%20Vanoise.pdf)). For ~5 walking days, this report plans the **classic Col d'Aussois loop from Pralognan**.

| Item | Classic loop (Col d'Aussois) | Grand tour (Col de Chavière) |
|---|---|---|
| Official start/finish | Pralognan / Les Fontanettes (Tarentaise) or Aussois (Maurienne); either direction | Pralognan, or Refuge de l'Orgère (Maurienne) |
| Distance | **~61–65 km** (official GPX: 60.7 km from Aussois, 64.0 km from Fontanettes) | ~79–82 km |
| Ascent / descent | **~3,850–4,100 m ↑ / ↓** | ~4,950–5,200 m ↑ / ↓ |
| Highest point | **Col d'Aussois, 2,912–2,916 m** (sources differ) | Col de Chavière, 2,785–2,796 m |
| Lowest point | Pralognan village 1,418 m (Fontanettes ~1,640 m) | same |
| Typical duration | **4–6 days** (park: 5–6) | 6–7 days |
| Usual direction | Park and Haute-Maurienne Vanoise (HMV) tourism describe it clockwise; Cicerone and Altituderando describe it anticlockwise | either |

Sources: official Geotrek records 73957 / 73951 / 56199 / 73936 on [rando.vanoise.com](https://rando.vanoise.com/fr/trek/73957-Tour-des-glaciers-de-la-Vanoise-%3A-au-depart-des-Fontanettes-et-en-passant-par-le-col-d-aussois), updated 4 Nov 2026; [Cicerone, *Trekking in the Vanoise*, 3rd ed. 2021, sample PDF](https://filestore.cicerone.co.uk/assets/0863_trekking-vanoise-webpdf-20222.pdf); [Altituderando 5-day report](https://www.altituderando.com/Tour-des-Glaciers-de-la-Vanoise-5-jours).

**Managing organisations:**
- **Parc national de la Vanoise:** route sheet, official GPX, core-zone rules. It owns the Valette, Arpont, Orgère and Plan du Lac refuges.
- **French Alpine Club federation (FFCAM):** runs Col de la Vanoise, Fond d'Aussois, Dent Parrachée and Péclet-Polset.
- **Private operators:** Roc, Plan Sec, Fournache and Montana.
- **Waymarked long-distance paths:** parts of the route follow the GR5 and GR55.

**Confidence: High** on identity and geography. **Confidence: Medium** on exact totals, which differ by start point and data source.

### 1.2 Character & Experience

- **High balcony walking around a glacier cap.** Almost all walking is above 2,000 m, beneath the Grande Casse (3,855 m, the Vanoise's highest summit), the Dent Parrachée and the glaciers of the Vanoise cap. HMV calls it the largest ice cap in the Alps, a promotional claim. The landscape is mostly mineral: moraines, scree, glacial lakes and powerful glacial streams.
- **Wildlife, which is the park's signature.** You will almost certainly see ibex, chamois and marmots. Bearded vultures and golden eagles are possible. The Orgère valley sheltered France's last ibex population, and the park was founded around it in 1963 ([PNV Guide Expériences 2026](https://vanoise-parcnational.fr/sites/vanoise-parcnational.fr/files/2026-06/Guide%20Experiences%20Vanoise%202026.pdf)).
- **Glacier retreat is visible:**
  - the Lac de l'Arpont is a recent lake left by the retreating glacier;
  - the Lac des Assiettes has been dry since 1995;
  - in 2025 the park drained a glacial lake above the Grand Marchet ([Journal Vanoise n°41](https://www.vanoise-parcnational.fr/sites/vanoise-parcnational.fr/files/2025-10/Journal%20Vanoise%2041_Web.pdf)).
- **Pastoral culture.** Summer farms (alpages) make Beaufort cheese, for example at Ritort below the Col d'Aussois. Flocks are guarded by livestock guard dogs (*patous*).
- **Popularity:** a well-known French trek, less international than the Tour du Mont Blanc. The park's visitor peak is **20 July–15 August**, so early July is relatively quiet ([PNV summer 2026 review](https://vanoise-parcnational.fr/actualites/bilan-de-la-saison-estivale-2026-par-les-agents-daccueil-du-parc)).
- **Highlights:**
  - the Col de la Vanoise lakes under the Grande Casse;
  - the Voûtes du Clapier Blanc balcony above the Leisse/Rocheure valleys;
  - the Lac Blanc and Arpont glacier views;
  - the Col d'Aussois (2,914 m), with an optional Pointe de l'Observatoire (3,015 m);
  - the Valette refuge perched at 2,590 m;
  - the Grand Marchet cirque.

### 1.3 At a Glance

| Item | Summary |
|---|---|
| Difficulty | Park: **"Difficile"**. The Valette ↔ Fontanettes stage is rated **"Très difficile"** ([Geotrek 73953](https://rando.vanoise.com/fr/trek/73957-Tour-des-glaciers-de-la-Vanoise-%3A-au-depart-des-Fontanettes-et-en-passant-par-le-col-d-aussois)). On the Swiss T-scale, camptocamp rates it T2 overall, T3 for the Col d'Aussois and T4 around the Grand Marchet (chains). |
| Ideal season | Park: late June → September. **Mid-July to early September is the most reliable** for snow-free passes. |
| Accommodation | Guarded refuges with half-board (dinner, bed, breakfast). Bivouac (an overnight tent, pitched evening to morning) only beside certain refuges, booked ahead. |
| Daily demands | 5–20 km and 2–8 h a day, with 450–1,250 m of ascent. |
| Key considerations | ⚠️ **Early-July névés** (hard snow patches lingering into summer) on the Col d'Aussois north side, Roc du Tambour, Petit Marchet and Cirque du Dard. ⚠️ Glacial stream crossings, which get harder by afternoon. ⚠️ The July 2026 wildfire damaged the only road to Pralognan (RD915); its 2027 status is not yet known. Several huts take **cash or cheque only**. Summer bus timetables reach full frequency only from about **4–6 July** (2026 pattern). |

> 💡 **Tip:** for a solo hiker in early July, the main decision is **direction and snow**. This report recommends **anticlockwise from Pralognan**, so both névé-prone passes (Grand Marchet/Pas de l'Âne and Col d'Aussois north side) are **climbed rather than descended**. See 13.1.

### 2.2 Stage-by-Stage Analysis

Stages are described **clockwise** to match the park's description. 13.1 reverses them for the recommended plan.

#### Stage 1 — Fontanettes / Pralognan → Refuge du Col de la Vanoise

- **Route options:**
  - **GR55:** via the Barmettes refuge, the Glière chalets and the Lac des Vaches, which you cross on flat stepping slabs, then the Grande Casse moraine (Seuil de l'Ouille) and the Lac Long to the refuge.
  - **Alternative:** up the Arcelin valley past the dry Lac des Assiettes, on slabs that can be slippery ([Geotrek 43825](https://rando.vanoise.com/fr/trek/56199-Tour-des-glaciers-de-la-Vanoise-%3A-au-depart-de-Pralognan)).
- **Demand:** steady ~900 m climb, mostly good path. The busiest stage, as it is also a popular day hike.
- **Scenery:** the Grande Casse north face and the Glacier des Grands Couloirs, plus the Aiguille de la Vanoise.
- 🛏️ **Hut:** Refuge du Col de la Vanoise, 2,517 m, 129 beds. **No bivouac.** **No phone signal**; the nearest signal is about 10 minutes away near the Lac des Assiettes ([hut practical info](https://refugecoldelavanoise.ffcam.fr/info-pratiques.html)).
- 💧 **Water:** Barmettes refuge and streams.

#### Stage 2 — Col de la Vanoise → Refuge de l'Arpont

- **Route:** gentle descent past the Lac Rond and the old blockhaus, then the long Voûtes du Clapier Blanc balcony above Entre-Deux-Eaux (1 h detour to that refuge, or to Plan du Lac). The path then climbs toward the Roche Ferran to the Lozières lakes under the Pelve glacier, with a short scree climb, and drops to the Lac Blanc and Arpont.
- ⚠️ **Boulder field below the Clapier Blanc:** "bien suivre les cairns… blocs semblent instables" (follow the cairns carefully; the boulders look unstable) ([Altituderando](https://www.altituderando.com/Tour-des-Glaciers-de-la-Vanoise-5-jours)).
- **Side trip:** Lac de l'Arpont, about ↑350 m and 1.5 h return.
- 🛏️ **Hut:** Refuge de l'Arpont (PNV, 2,309 m). It has phone signal, which Cicerone describes as good.

#### Stage 3 — Arpont → Aussois refuges

- **Route:**
  - Steep descent to the Le Mont junction (Termignon is 1.5 h away), then the Combe de l'Enfer.
  - A long balcony along the flank of the Dent Parrachée, with views to the Écrins and Thabor.
  - Exits along the way: La Loza (to Sardières, 1.5 h) and La Turra ruins (to Aussois, 2.5 h).
  - The final part follows an old military track, narrow where it is eroded.
- ⚠️ **Glacial streams:** the Grand Pyx, Pingon, Thibaud and l'Ile can be powerful.
  - The Grand Pyx footbridge was swept away on 30 Aug 2023 ([FFRandonnée](https://www.ffrandonnee.fr/s-informer/actualites/vanoise-une-passerelle-emportee-par-la-crue-d-un-ruisseau)).
  - A fixed cable protects the last crossing ([Geotrek 43829](https://rando.vanoise.com/fr/trek/56199-Tour-des-glaciers-de-la-Vanoise-%3A-au-depart-de-Pralognan)).
  - There is a short chain-protected exposed passage near point 2,245 m east of the Aussois lifts.
- **Overnight choices (1–4 km apart):**
  - Plan Sec, Fournache or Montana: the closest to Arpont.
  - Dent Parrachée or **Fond d'Aussois**: the best placed for the Col d'Aussois.
  - Peyra Levrousa: bivouac area.

#### Stage 4 — Aussois refuges → Col d'Aussois → Roc (or Valette)

- **Ascent:** cross the Pont de la Sétéria and go up the Fond d'Aussois valley, then two steep rises over rock and scree to the col (2,912–2,916 m).
  - Waymarking is **"discrètes marques jaunes"** (sparse yellow paint) plus cairns.
  - 💧 **The Fond d'Aussois refuge is the only drinking-water point** on this crossing ([Geotrek 2399](https://rando.vanoise.com/fr/trek/73957-Tour-des-glaciers-de-la-Vanoise-%3A-au-depart-des-Fontanettes-et-en-passant-par-le-col-d-aussois)).
- **Side trip:** the Pointe de l'Observatoire (3,015 m) is about 20 minutes and +100 m from the col. It is unmarked and unmaintained, and the summit edges a drop of several hundred metres.
- **North descent:** scree, then cairns between the Tête d'Aussois and the Pointe de Rosoire, down to the Rosoire footbridge, the Ritort alpage and the GR55 to the Roc.
- ⚠️ **Snow:** "Le col d'Aussois peut être enneigé tardivement" (the col can hold snow late into the season; [PNV 2025](https://www.vanoise-parcnational.fr/sites/vanoise-parcnational.fr/files/2025-05/Fiche%20rando%20Tour%20des%20glaciers%20de%20la%20Vanoise.pdf)). In mid-July 2024 two substantial névés remained on the north side, and crampons were recommended ([visugpx report](https://www.visugpx.com/9PTAVKJtN3)).

#### Stage 5 — Roc → Refuge de la Valette

- **Route:** Montaimont hamlet, the Plan des Bôs (where a shortcut is easy to miss), the Nants chalet, then around the Pic de la Vieille Femme.
- ⚠️ **Stream crossings** "peuvent être compliquée[s] en fin de journée" (can be difficult late in the day; park sheet). Cross before midday.
- 🛏️ **Hut:** Refuge de la Valette, 2,590 m. **Cash or cheque only.**

#### Stage 6 — Valette → Col du Grand Marchet → Fontanettes (the crux)

- **Route:** past the steep north face of the Roc du Tambour (lasting névé) and west of the Petit Marchet (another lasting névé). Then a **short exposed chain-protected passage**, the Col du Grand Marchet (~2,490 m), and a steep, cairned descent into the Cirque du Dard / Arcelin, which is often snowy late.
  - The Dard side has chains and metal steps.
  - Ibex can set off rockfall.
  - A stream crossing uses a footbridge installed once the snow bridge has melted.
- ✓ **Recommended:** the park advises **"jusqu'à début juillet, préférer la descente directe… par le Pas de l'Âne"** (until early July, take the direct Pas de l'Âne route instead), 2.5–3 h to Pralognan. You can then take the shuttle up to the Fontanettes.
  - Even on the Pas de l'Âne, a rock slab between it and the Roc du Tambour **can be icy and is not advised when wet**.
  - Another option is to descend from Valette to Les Prioux and take the shuttle.

#### Chavière grand-tour stages (variant)

- **Aussois → Orgère:** via the Col du Barbier, an easy GR5 balcony through arolla pine (13 km, ↑600 ↓900, 5 h). Or via the steep Col de la Masse (~2,920 m; 12 km, ↑850 ↓1,150, 6.5 h).
- **Orgère → Péclet-Polset:** over the Col de Chavière (9 km, ↑900 ↓360, 4 h). **"Névés importants… en début de saison"** (large snow patches early in the season).
- **Péclet-Polset → Valette:** via the Cirque d'Ariande and the Génépy (17.5 km, ↑1,200 ↓1,100, 7.5 h). Footbridges are reinstalled around mid-June, depending on snow.

## 3. Difficulty & Trail Conditions

### 3.1 Physical Difficulty

- **Overall:** demanding but not extreme. Expect **~800–1,250 m of ascent on the big days** at 2,000–2,900 m, with plenty of rough, rocky ground.
- **Hardest days (anticlockwise plan):**
  - **Valette → Col d'Aussois → Fond d'Aussois:** ~16–20 km, ↑1,150–1,250 ↓1,400–1,450, **7.5–8 h**. It includes the long climb from the Roc (1,911 m) to the col (2,914 m), about 1,000 m in one go.
  - **Fond d'Aussois → Arpont:** ~20 km, ±~900–1,000 m, 6.5–7 h, a long balcony with stream crossings.
  - **Pralognan → Valette:** ~1,200 m of climbing, which is hard on arrival day legs.
- **Cumulative fatigue:** moderate. The last day (Col de la Vanoise → Pralognan) is short and all downhill.
- **Fitness:** comfortable with 7–8 h days carrying 7–9 kg and 1,000 m+ climbs on consecutive days. Prior experience on rough alpine paths matters more than speed.

### 3.2 Technical Difficulty

| Feature | Where | Rating / notes |
|---|---|---|
| Chains / metal steps, short exposure | Col du Grand Marchet, Petit Marchet, Cirque du Dard | Camptocamp **T4**; park "Très difficile" |
| Steep scree, sparse marking | Col d'Aussois both sides | T3 |
| Short chained exposed ledge | GR5 near point 2,245 m (Aussois heights) | Brief |
| **Névés** | Col d'Aussois N side, Roc du Tambour N face, Petit Marchet W, Cirque du Dard, Col de Chavière | ⚠️ The main early-July hazard. CRS Alpes (the national police mountain rescue unit): "Le danger majeur, c'est la glissade" (the main danger is slipping) ([16 Jun 2026](https://www.mon-sejour-en-montagne.com/actualites/le-danger-majeur-c-est-la-glissade-prudence-sur-les-sentiers-des-alpes-encore-enneiges/)) |
| Glacial stream crossings | Arpont ↔ Aussois balcony; Roc ↔ Valette; Péclet-Polset ↔ Valette | Cross in the morning; a fixed cable at one crossing. A camptocamp report of 8 Jul 2020 notes wet feet in low shoes. |
| Boulder field | Below the Voûtes du Clapier Blanc | Follow the cairns |

**Early-July snow evidence:**

| Date / source | Conditions |
|---|---|
| 8–11 Jul 2020 (camptocamp) | About 30 firm névés above 2,200 m with tracks; poles sufficed |
| 3 Jul 2021 | Steep névé under the Col du Petit Marchet |
| 18 Jun 2023 | Roc du Tambour "problématique sans crampons" (a problem without crampons) |
| 15–19 Jul 2024 | Crampons recommended on the Col d'Aussois north side |

Cicerone: "an early season visit will usually need an ice axe and maybe crampons" ([Cicerone article](https://www.cicerone.co.uk/the-tour-des-glaciers-de-la-vanoise-where-the-french-go-trekking)).

**Confidence: High** that névés are likely in the first week of July. Their **size and hardness in 2027 are unknowable now**.

### 3.3 Elevation

- **Range:** 1,418 m (Pralognan) → 2,912–2,916 m (Col d'Aussois). Most walking is at 2,000–2,700 m.
- **Overnight altitudes:** 2,309 m (Arpont) to 2,590 m (Valette).
- **Big climbs (anticlockwise):** Pralognan → Valette (~1,200 m); Roc → Col d'Aussois (~1,000 m); Arpont → Col de la Vanoise (~670 m).
- **Big descents:** Col d'Aussois → Fond d'Aussois (~570 m, steep scree); Col de la Vanoise → Pralognan (~1,100 m).
- **Altitude effects:** acute mountain sickness (AMS) is usually defined as headache above 2,500 m in an unacclimatised person. Sleeping at 2,517–2,590 m on the first night is near that threshold. Risk is low, but a first night at Valette straight from sea level can mean a headache or poor sleep. This is my assessment: the AMS definition is sourced ([UNIL](https://serval.unil.ch/resource/serval:BIB_43D27931DA3F.P001/REF)), but its application to this route is not. One night in Pralognan (1,418 m) first helps.

### 3.4 Trail Condition

- **Maintenance:** the park maintains the paths. Seasonal staff work mid-May to mid-October, and **footbridges are reinstalled around 15 June** ([PNV, 9 Oct 2026](https://vanoise-parcnational.fr/actualites/un-jour-avec-un-agent-du-parc-national-de-la-vanoise-1)). The route sheet asks hikers to check with hut keepers that the seasonal footbridges are in place.
- **Flood damage from 13 Aug 2023:**
  - The Grand Pyx footbridge (Arpont ↔ Plan Sec) and the Rosoire footbridge (Col d'Aussois north descent) were destroyed.
  - Park decision 2024-28 (4 Jul 2024) authorised a new wooden footbridge and path deviation at Rosoire, and removal of the temporary Grand Pyx bypass ([decision PDF](https://vanoise-parcnational.fr/sites/vanoise-parcnational.fr/files/2024-07/D%C3%A9cision%20nominative%20n%C2%B0%202024-028_0.pdf)).
  - In July 2024 hikers met two park detours (Rosoire, Génépy).
  - ⚠️ **Confidence: Low** that both crossings are permanently fixed. This is not confirmed.
- **Erosion:** an old military track is narrow in places on Arpont ↔ Aussois. There are unstable boulders under the Clapier Blanc and ibex-triggered rockfall on the Grand Marchet.
- **Mud:** not a significant issue reported.
- **Snow:** see 3.2 and 4.1.

## 4. Season & Weather

### 4.1 Hiking Season

- **Hikeable:** late June → mid/late September. The park recommends **"fin juin à septembre"** (2025 sheet) and "début juillet → septembre" (2024 sheet).
- **Hut guarded seasons 2027** (📅 Checked: 7 November 2026):
  - Col de la Vanoise: **5 Jun–18 Sep 2027**.
  - Fond d'Aussois: **5 Jun–18 Sep 2027**.
  - Valette: **19 Jun–18 Sep 2027** on its own site, but **12 Jun–11 Sep 2027** on the Pralognan office list. This is a conflict; either way it is open in early July.
  - Arpont: 2026 was 6 Jun–18 Sep; 2027 not yet published.
  - Roc: 31 May–24 Sep 2027.
- **Best months:** mid-July to early September for snow-free passes and full transport. Early July gives quieter huts, flowers and long days, but more snow and thinner buses (see 8.3).
- **Shoulder season (late June / first week of July):**
  - Névés on every high section.
  - Some stream footbridges may not yet be in place.
  - Reduced shuttle and bus timetables.
  - The park advises the Pas de l'Âne instead of the Grand Marchet "until early July".

### 4.2 Weather Patterns

| Station (Météo-France normals 1991–2020, July) | Mean max | Mean min | Precip | Rain days ≥1 mm |
|---|---|---|---|---|
| [Pralognan 1,420 m](https://object.files.data.gouv.fr/meteofrance/data/synchro_ftp/REF_STATION/FICHECLIM_73206001.pdf) | 21.0 °C | 9.2 °C | 98 mm | 10.9 |
| [Aussois 1,467 m](https://object.files.data.gouv.fr/meteofrance/data/synchro_ftp/REF_STATION/FICHECLIM_73023001.pdf) | 21.7 °C | 10.4 °C | 51 mm | 8.1 |

- **Higher up:** there are no official normals at pass level. Observations from high automatic stations (4.3) show early-July days averaging **about 13–14 °C at 2,560 m and about 13 °C at 2,800 m**, with nights around 5–7 °C. Frost occurs on a few nights in most early Julys.
- **Maurienne vs Tarentaise:** the Maurienne side (Aussois) is noticeably drier.
- ⚠️ **Thunderstorms:** typically late afternoon or evening, sometimes as early as 10:00. No official frequency data exists. Use the [Météo-France vigilance map](https://vigilance.meteofrance.fr/fr/dangers-meteorologiques-orages).
- **Heat:** recent summers brought repeated heatwaves (park 2026 review). MeteoSwiss recorded record freezing levels above 5,100 m in June and August 2025. Heat speeds snowmelt and swells glacial streams in the afternoon.
- **Wind, fog, rain:** fog on the cols makes navigation harder, especially on the sparsely marked Col d'Aussois and the Grand Marchet descent. Summer snowfall on the cols is possible during cold spells; in 2025 it fell on 6–10 July (see 4.3).

### 4.3 Historical Weather for the Planned Travel Window

📍 **Window analysed: 5–11 July** (your trek is 6–10 July 2027). 1–15 July is shown in brackets where useful. This is **climate history, not a forecast**. Data were computed from [Météo-France daily station observations for Savoie](https://www.data.gouv.fr/fr/datasets/donnees-climatologiques-de-base-quotidiennes/) for 2015–2026 (data to 6 Nov 2026) and from the [Open-Meteo archive (ERA5 / ERA5-Land reanalysis)](https://archive-api.open-meteo.com/v1/archive) for 2000–2026. Accessed 7 November 2026.

**Pass-level estimate from reanalysis, 5–11 July**

ERA5 is a global model grid of about 28 km; ERA5-Land is about 9 km. Both were height-adjusted to the pass altitude.

| Point | Mean TN / TX, 2000–26 | Mean TN / TX, 2015–26 | Nights ≤0 °C, 2015–26 | Mean daily max gust | Days with gusts ≥60 km/h |
|---|---|---|---|---|---|
| Col de la Vanoise (2,522 m) | 3.9 / 13.2 °C | 5.5 / 15.2 °C | ~3% | ~44 km/h | ~7% |
| Col d'Aussois (2,916 m) | 1.2 / 10.9 °C | 2.7 / 13.0 °C | **~15%** | ~45 km/h | ~11% |

Limitations:
- Reanalysis is modelled, not measured, and does not resolve thunderstorms.
- Its rain-day frequency (~45–49%) is far higher than the stations show; trust the stations for rain.
- The high ridge stations show a smaller day–night temperature range than the reanalysis.

**What the record says about your window**

- **Temperatures:**
  - Valley days are warm: 23–26 °C on average, with peaks of 32–34 °C in 2015, 2023 and 2026.
  - Hut-level days (2,300–2,600 m) are about 13–18 °C.
  - At the Col d'Aussois, expect about 10–14 °C by day and near or below freezing on some mornings.
- **Rain:**
  - Rain of 1 mm or more fell on about **1 day in 4** at every valley station, so expect roughly 1–2 wet days in a 5-day trek.
  - Weekly rain totals at Pralognan ranged from 0 mm (2022) to 44.5 mm (2021).
- **Thunderstorms:**
  - There are no official thunderstorm normals.
  - Volunteer observers recorded thunder on **about 11% of 5–11 July days at Pralognan** (2015–23), roughly one storm day a week.
  - July totals were about 5 thunder days at Pralognan, Termignon and Bessans (2010–24), and 8.5 at Bourg-Saint-Maurice, where every day was observed.
  - These are lower bounds.
  - The stormiest July on record in this data was 2018, with 10 thunder days at Pralognan.
- **Snow:**
  - The Bellecôte snow station (2,992 m) still had **snow on the ground in about 6 of 11 years** in this window, with 160–215 cm in 2016, 2020, 2021 and 2024.
  - Ridge stations at 2,560–2,740 m were snow-free in almost every year.
  - These sensors sit on flat, wind-exposed sites and **say nothing about north-facing névés**, which persist much longer.
  - Météo-France called the 2024 high-altitude snow cover "remarquable" ([2024 annual review](https://meteofrance.fr/sites/default/files/files/editorial/Bilan-climatique-annuel-2024-meteo-france-web_3.pdf)).
- **Variability: two recent extremes.**
  - **2025:** a late-June heatwave was followed by a **sharp cold snap on 6–10 July**.
    - Bessans fell to −1.7 °C on 9 July, its July record.
    - Bellecôte reached −5.6 °C, with a high of only 0.5 °C on 8 July.
    - More than 5 cm of snow fell at 2,000 m near Modane ([MeteoNews](https://www.meteoetradar.ch/actualites-meteo/juillet-bouscule-france-frais-inedit-et-flocons-dans-les-alpes--c4c9d5ab-5c8b-4734-aac8-c32a52b0f7ce)).
  - **2026:** an orange heatwave warning for Savoie from 7 July, with Termignon at 30–32 °C ([Savoie bulletin, 7 Jul 2026](https://www.chapareillan.fr/wp-content/uploads/2026/07/2026_07_07_bulletin_departementale_vigilance_orange_canicule-1.pdf)).
- **Wind:**
  - Mean daily maximum gusts were 11–15 m/s (40–55 km/h) at the 2,000–2,800 m stations.
  - The strongest gust was 127 km/h at La Masse in July 2017.

> 💡 **Tip:** pack for both extremes of early July: summer heat in the valleys and possible snow and frost on the passes. Recent years (2015–2026) are about 1.5–2 °C warmer at pass level than the 2000–2026 average.

**Confidence: High** for station data. **Medium** for pass-level estimates (proxy stations 11–17 km away; reanalysis limits).

## 5. Navigation & Route Finding

### 5.1 Waymarking

- **Types:**
  - GR5 and GR55 sections carry red/white marks.
  - Park signposts stand at the main junctions.
  - The **Col d'Aussois has only "discrètes marques jaunes" (sparse yellow paint) and cairns**.
  - The park core boundary on the GR5 is marked with blue-white-red paint.
- **Overall:** Altituderando says the route is "pas ou peu balisés" (barely or not marked) between junctions, but directions are "bien indiquées aux principales intersections" (well signed at the main junctions). Study each day beforehand.
- **Problem spots:**
  - Plan des Bôs shortcut (Roc ↔ Valette): easy to miss.
  - Clapier Blanc boulder field: follow the cairns.
  - Col du Petit Marchet path: unmarked.
  - Grand Marchet / Dard descent: in mist.
  - Col de la Masse descent (Grand tour only).
  - The Col d'Aussois itself: in fog or on snow-covered cairns.

### 6.1 Accommodation System

### 6.2 Booking Strategy

- **Portal:** [refuges-vanoise.com](https://www.refuges-vanoise.com/) lists 13 loop huts and links to each hut's booking page. Payment is a card deposit online (Visa/MasterCard/CB; virtual e-cards refused).
- **FFCAM huts** (Col de la Vanoise, Fond d'Aussois, Dent Parrachée, Péclet-Polset): [conditions](https://refugecoldelavanoise.ffcam.fr/conditions-generales-de-vente.html).
  - The deposit covers the bed only.
  - Cancel **more than 2 days ahead → refund**; less than 2 days → deposit kept.
  - Online booking closes 2 days before arrival; after that, phone the hut.
  - Maximum 5 consecutive days per booking file.
  - Refund if the federation cancels for weather or snow.
- **Valette (PNV):** deposit €15 per person. Cancel more than 2 days ahead → refund minus €1 ([tarifs](https://refuge-valette.vanoise.com/tarifs)).
- **When bookings open** (📅 Checked: 7 November 2026):
  - Valette and Roc: 2027 already showing.
  - **Col de la Vanoise: "courant novembre 2026"** (sometime in November 2026).
  - Fond d'Aussois: its site said "courant septembre" (no year given).
  - Others: unknown.
- **How busy:** no occupancy data exists. The portal warns that summer demand "limite rapidement les disponibilités" (quickly limits availability). A specialist operator advises booking **at least 6 weeks ahead** and calls June–early July quieter ([La Vie Sauvage](https://www.laviesauvage-rando.com/fr/actualites/134-tour-des-glaciers-de-la-vanoise)). Cicerone's older "a few days ahead" advice is outdated.

✓ **Recommended:** book all four nights **as soon as each hut opens 2027 reservations (Nov 2026–early 2027)**. Fond d'Aussois (52 beds) and Valette (44) are the bottlenecks. Booking early costs nothing, because cancellation is free more than 2 days out.

### 6.4 Camping

- **Core-zone bivouac rules** ([PNV regulations](https://vanoise-parcnational.fr/votre-visite/preparer-sa-visite/la-reglementation-dans-le-coeur-du-parc) · [FAQ](https://vanoise-parcnational.fr/foire-aux-questions) · [bivouac brochure, Feb 2024](https://www.savoie.fr/upload/docs/application/pdf/2025-06/brochure_bivouac_-_parc_national_de_la_vanoise.pdf.pdf)):
  - only on designated spots next to listed refuges, while the hut is guarded (roughly 1 Jun–30 Sep);
  - **reservation mandatory**;
  - tent up **19:00 → strike by 08:00**;
  - small, low tents only;
  - fee ≤€6;
  - fine €68;
  - no fires, but stoves allowed.
- **Allowed at:** Arpont, Valette, Plan du Lac, Orgère, Fond d'Aussois, Entre-Deux-Eaux, Plan Sec, Fournache.
- **Not allowed at:** **Col de la Vanoise** (crowding and sewage system) and **Péclet-Polset**. Dent Parrachée is disputed.
- **Bivouac with half-board:** €41–44 at several huts (you camp, but eat dinner and breakfast inside).
- **Valley campsites:**
  - Pralognan, Camping Le Chamois: 6 Jun–13 Sep 2026.
  - Termignon, Les Mélèzes: 22 May–13 Sep 2026.
  - Aussois, La Buidonnière: all year.
- **Conflict:** Arpont's own site gives bivouac hours as 18:00–08:00, against the park's 19:00–08:00. Follow the park rule.

**Assessment:** camping saves about €15–20 a night with bivouac half-board, but adds 2–3 kg. It is impossible at Col de la Vanoise, one of the four nights in the recommended plan. For a solo hiker on public transport, **refuges with half-board are the better choice**.

## 7. Food, Water & Resupply

### 7.1 Water

- 💧 **Huts:** drinking water at every guarded refuge. The park FAQ says so, subject to drought rationing.
- 💧 **Streams:** "eau omniprésente" (water everywhere) on the route ([visugpx](https://www.visugpx.com/9PTAVKJtN3)). There are many streams, but pastures with sheep and cattle sit upstream. **Treat stream water**; the park's bivouac checklist suggests carrying purification tablets.
- ⚠️ **Long dry stretch:** on the Col d'Aussois crossing, **Fond d'Aussois is the only drinking-water point** ([Geotrek 2399](https://rando.vanoise.com/)). Leave Fond d'Aussois (or Roc, in the clockwise direction) with **1.5–2 L**.
- **Carry:** 1.5–2 L on most days, plus a filter or tablets. There is no published list of water sources, so **mid-stage water points are unconfirmed**.

### 7.2 Food

- 🍴 **Valley shops:**
  - **Pralognan:** Casino Shop (all year), Sherpa (seasonal), bakeries ([shop list, 6 Nov 2026](https://grc.pralognan.com/medias/documents/documentation/documentation-COMMERCES-FR.pdf)).
  - **Aussois:** Vival, cards accepted.
  - **Termignon:** Utile Alimentation.
- 🍴 **On the trail:** huts serve dinner and breakfast, sell drinks and usually snacks, and provide packed lunches at €11–13 (order the night before).
- **No shops** between Pralognan and the end of the loop on the recommended plan.

### 7.3 Resupply Strategy

- **Start:** buy 4–5 days of snacks and trail food in Pralognan. Hut picnics cover lunch.
- **No resupply needed** on a hut-based trek: huts provide two meals and a picnic daily. Carry about 1 kg of snacks plus 1 day's emergency food.
- **Optional detours to shops:** Aussois village (about 2 h below the Aussois huts) and Termignon (via the Bellecombe shuttle). You won't need them.
- **No services mid-stage:** Valette → Fond d'Aussois (except the Roc refuge en route), Fond d'Aussois → Arpont, and Arpont → Col de la Vanoise (Entre-Deux-Eaux and Plan du Lac are detours).

### 8.4 Pre- and Post-Trek Logistics

- **Accommodation:** sleep in **Pralognan** the night before (it acclimatises you and lets you catch the first shuttle) and ideally the night after. The Barmettes refuge (1 h above the Fontanettes, HB €58 in 2025) is an alternative first night.

## 9. Safety & Risk Management

### 9.1 Main Hazards

| ⚠️ Hazard | Where / when | Mitigation |
|---|---|---|
| **Slipping on névés** | Col d'Aussois N side, Roc du Tambour, Petit Marchet, Cirque du Dard, Col de Chavière; early July | Ask hut keepers each evening. Carry microspikes and poles. **Climb snow, don't descend it** (direction choice). Use the Pas de l'Âne instead of the Grand Marchet. **Turn back** on steep hard snow. |
| Glacial streams | Arpont ↔ Aussois; Roc ↔ Valette; afternoon melt | Cross in the morning; use footbridges and the fixed cable; don't cross a fast torrent alone |
| Thunderstorms / lightning | Afternoons; exposed cols | Start at 07:00; be off the cols by early afternoon; watch the Météo-France vigilance map |
| Exposure / chains | Grand Marchet / Dard; GR5 near point 2,245 m | Dry rock only; avoid in rain, ice or mist |
| Rockfall | Grand Marchet (ibex), moraines, Clapier Blanc boulders | Don't linger below cliffs |
| Navigation in fog | Col d'Aussois, Grand Marchet | Offline GPX, paper map, cairn discipline |
| Livestock guard dogs (patous) | Pastures, especially on the Maurienne side | Park advice: "Contournez les troupeaux… arrêtez-vous ou avancez doucement… parlez-lui calmement et ne brandissez pas vos bâtons" (go around flocks; stop or move slowly; speak calmly; don't wave your poles) ([Guide Expériences 2026](https://vanoise-parcnational.fr/sites/vanoise-parcnational.fr/files/2026-06/Guide%20Experiences%20Vanoise%202026.pdf)). Check [Map Patou](https://www.pasto-kezako.fr/ou-sont-les-chiens-de-protection-2/). Pepper spray is strongly discouraged. |
| Heat / UV | Heatwaves; snow glare | UV rises ~10% per 1,000 m and snow reflects 40–90%: sunglasses (category 3–4), sunscreen, a hat |
| Wildlife | Vipers (asp and adder), wolves (shy), ibex | Don't approach animals |
| Wildfire / road closure | Valley (RD915 in 2026) | Check Département notices |

### 9.2 Emergency Planning

- ☎ **112** (all emergencies; works without credit on any SIM). Also 15 (medical), 17 (police), 18 (fire), and **114** by SMS for deaf or speech-impaired people ([service-public.fr, Aug 2026](https://www.service-public.gouv.fr/particuliers/vosdroits/F33954)). The park sheet says: "Secours en montagne : composez le n°112".
- **Who rescues:**
  - **PGHM Savoie** (gendarmerie mountain rescue), Bourg-Saint-Maurice plus a detachment at **Modane**, with a gendarmerie helicopter based at Modane.
  - CRS Alpes also perform rescues.
  - A Sécurité civile summer helicopter is based at Courchevel (2021 source).
  - Direct PGHM numbers circulating online are unofficial and unverified, so **use 112**.
- **How the coverage gaps (12.3) affect emergency calls:**
  - If your own network has no signal, a phone with a SIM will place a **112 call through any French network in range** and show "emergency calls only" ([Selectra, Aug 2026](https://selectra.info/telecom/actualites/marche/appeler-112-urgence-sans-reseau-sans-carte-sim)). Keep a SIM in the phone.
  - **Where no network exists at all, 112 will not work.** That means Roc → Col d'Aussois → Fond d'Aussois, Entre-Deux-Eaux, and inside the Col de la Vanoise hut. From that hut, walk about 10 minutes towards the Lac des Assiettes.
  - **Advanced Mobile Location**, which sends your GPS position automatically with an emergency call, has been used in France since 2020 and is mandatory on EU-sold smartphones ([ETSI](https://www.etsi.org/newsroom/press-releases/2040-2022-03-etsi-advanced-mobile-location-standard-now-mandatory-on-all-european-smartphones-for-emergency-calls)). Still read out your coordinates.
  - The **114** SMS line is designed for deaf or speech-impaired people and may not accept foreign SIMs, so don't rely on it.
- **Backup communication:**
  - ✓ **Recommended for this solo trek:** a satellite messenger (Garmin inReach / Zoleo), or iPhone 14+ / Pixel 9+ satellite SOS, which works in France (see 12.3).
  - Hut bookings act as a check-in system; always tell the hut if your plans change.
  - Before the day-2 dead zone, tell the Valette or Roc hut keeper that you are heading for Fond d'Aussois.
- **If you need help:** call 112 and give your location (GPS coordinates) and the nature of the injury, then stay put. Make yourself visible: arms raised in a Y means "yes, we need help".

[service-public emergency numbers](https://www.service-public.gouv.fr/particuliers/vosdroits/F33954) · [PNV regulations](https://vanoise-parcnational.fr/votre-visite/preparer-sa-visite/la-reglementation-dans-le-coeur-du-parc) · [FFRandonnée on rescue costs](https://www.ffrandonnee.fr/s-informer/actualites/les-secours-en-montagne-ne-sont-pas-automatiquement-gratuits)

### 9.3 Bailout & Escape Options

| Section (anticlockwise) | Escape | Difficulty |
|---|---|---|
| Pralognan → Valette | Back down to Pralognan or Les Prioux (shuttle) | Easy |
| Valette → Roc | Roc → Pont de la Pêche → Les Prioux → shuttle to Pralognan | Easy |
| **Roc → Col d'Aussois → Fond d'Aussois** | **No exit between the Roc and the Aussois huts.** After the col: Fond d'Aussois → Plan d'Amont → Aussois village (~2 h), then S52 bus to Modane | ⚠️ **Committing.** Decide at the Roc. |
| Fond d'Aussois → Arpont | Aussois (from the huts or La Turra, 2.5 h); Sardières (from La Loza, 1.5 h); Termignon (from Le Mont, 1.5 h) | Several exits |

Getting back from the Maurienne side to Pralognan by public transport takes most of a day: S52 to Modane, train to Chambéry, TER to Moûtiers, S66 to Pralognan.

### 9.4 Health & Insurance

**Bottom line for this trip (research date 7 Nov 2026, not individual medical advice):**
- No vaccine is **required** for entry to France.
- No itinerary-driven vaccine is clearly **recommended** for a 5-day alpine hut trek in Savoie in July.
- The useful actions are:
  1. Check that **tetanus–diphtheria** and **MMR (measles)** are up to date.
  2. Decide on **TBE** (tick-borne encephalitis) vaccination **this winter** with a travel-health clinician, but only if you also hike often in TBE-endemic Europe or have personal risk factors.
  3. Buy **insurance that explicitly covers mountain search, rescue and helicopter evacuation**.

**Vaccines: routine and itinerary-driven** (classification is provisional because your vaccination history is unknown):

| Vaccine | Assessment | Why |
|---|---|---|
| **Tetanus / diphtheria** (± pertussis, polio) | **Verify / booster if more than 10 years** | Wound risk on scree and in pastures with soil and manure; a possible patou bite; huts are hours from care ([TravelHealthPro France](https://travelhealthpro.org.uk/countries/france)) |
| **MMR** | **Verify 2 doses** | Dormitories and trains. Savoie had a measles cluster in **Val Thorens, Jan 2026** ([ARS ARA, 3 Feb 2026](https://www.auvergne-rhone-alpes.ars.sante.fr/media/156189/download)) and Haute-Savoie had an active cluster in mid-2026. France recorded 114 cases Jan–Sep 2026 ([Santé publique France, 15 Oct 2026](https://www.santepubliquefrance.fr/rougeole/bulletin-regional/rougeole-en-france-du-1er-janvier-au-30-septembre-2026)) |
| TBE | Usually not indicated by this itinerary alone; see the TBE assessment below | — |
| Hepatitis A / B, typhoid, rabies, meningococcal | **Not indicated** by this itinerary | Normal hut sanitation. Mainland France has been free of terrestrial rabies since 2001. A 2025 hepatitis A outbreak in Lyon has ended ([SpF ARA, 3 Nov 2026](https://www.santepubliquefrance.fr/sites/default/files/2026-11/bullreg_VHA_ara_20261103.pdf)) |
| Bat rabies | Pre-exposure vaccine only for planned bat contact | **Any bat contact → urgent assessment** at a rabies treatment centre (*centre antirabique*) ([Institut Pasteur](https://www.pasteur.fr/fr/journal-recherche/actualites/cas-rare-deces-suite-infection-virus-chauve-souris-proche-rage)) |

**Administrative:**
- France, Switzerland and Italy have **no vaccination certificate requirement** under the International Health Regulations ([TravelHealthPro](https://travelhealthpro.org.uk/countries/france)).
- Conditional exceptions depend only on your origin:
  - **yellow fever** proof if arriving from a country with yellow fever transmission (check the current WHO list);
  - **polio** exit rules if departing from a polio-infected country (Pakistan or Afghanistan).

**TBE assessment** (from the dedicated TBE research):
- **Background activity on the route: sporadic / uncertain.**
  - Savoie recorded **4 locally acquired TBE cases in 2021–24** (2 in 2024). Where in Savoie is unknown; one may have been in the Bauges/Chartreuse area (unverified).
  - Savoie is **not** among the zones Santé publique France names for active virus circulation in the region. The established, rising focus is **Haute-Savoie** (Aravis/Thônes/Le Reposoir, 50–80 km north): 19 cases in 2025 and 13 by Sep 2026 ([SpF ARA tick bulletin, May 2026](https://www.santepubliquefrance.fr/sites/default/files/2026-05/bullreg_tiques_ara_20260505.pdf) · [ARS ARA, Sep 2026](https://www.auvergne-rhone-alpes.ars.sante.fr/tiques-restez-vigilants-lors-de-vos-activites-en-pleine-nature)).
  - Wildlife blood samples from the adjacent Italian Susa valley (2017–19) were negative for the virus.
- **Season:** July is **inside the peak**. France had 98 cases in 2025, peaking in July ([SpF national bulletin, May 2026](https://www.santepubliquefrance.fr/sites/default/files/2026-05/bullnat_tbe_20260512.pdf)).
- **Your exposure: low to moderate.**
  - Most walking is in alpine meadow, scree and rock at 2,000–2,900 m, which is poor tick habitat but **not zero**. *Ixodes ricinus* ticks are now found regularly above 1,600 m in the north-west Alps.
  - The real tick exposure is the forested and meadow approach sections at ~1,400–1,900 m (Pralognan valley, Les Prioux / Roc, Aussois).
  - **No elevation is risk-free.**
- **Overall TBE concern: Low.** This is a relative rating, not a probability.
- **Vaccination: usually not indicated by this trip alone.** It becomes reasonable to consider if you also hike or camp regularly in TBE-endemic Europe (Haute-Savoie, Switzerland, Austria, southern Germany, Central Europe), are 60 or older, or have low tolerance for a rare severe outcome.
  - A full primary course takes months (ARS ARA cites 3 doses: 2 a month apart, the 3rd at 12 months; about €55 per dose), so **decide in winter 2026–27**.
  - French policy is changing: the national vaccine authority (HAS) consulted on a broader strategy in June 2026, and whether it has been adopted is unresolved.
- **Confidence: Medium.** Data are official and recent, but only at département level.
- **Where the two research strands differed:** the general vaccine research left TBE as "reasonable to consider". The TBE research, using finer Savoie-level data, concluded "usually not indicated". This report follows the TBE research because it is more geographically specific.
- **Prevention either way:**
  - long trousers on the forested approaches;
  - repellent;
  - sit on a cloth, not in grass;
  - **check your body for ticks every evening** with a tick remover;
  - watch any bite site for 4 weeks (Lyme disease is far more common than TBE: Auvergne-Rhône-Alpes had about 4,600 estimated cases in 2024).
  - Raw goat or sheep milk products have caused French TBE clusters, so prefer pasteurised products if you are concerned. Beaufort is a cow's-milk cheese and was not specifically implicated.

**Other health points:**
- Mild altitude symptoms are possible on the first night above 2,500 m.
- Sun and snow glare.
- Blisters on long rocky descents.
- Treat stream water.
- Pralognan has a pharmacy open all year (04 79 08 71 61) and two doctors.

**Insurance:**
- **State rescue cost:** "en principe gratuit" (free in principle) for a person in danger. A helicopter evacuation must be "justifiée" (justified). Uninjured people have been refused public evacuation and paid a private operator ([FFRandonnée, 21 Aug 2026](https://www.ffrandonnee.fr/s-informer/actualites/les-secours-en-montagne-ne-sont-pas-automatiquement-gratuits)). Rescue within ski areas is billed.
- **Hospital treatment, repatriation and private evacuation are not free.**
- **The EHIC and GHIC** (European and UK state health cards) **don't cover mountain rescue or repatriation** ([GOV.UK France health](https://www.gov.uk/foreign-travel-advice/france/health)).
- **FFCAM licence insurance** (Alpine-club membership cover): €25 for France/EU; World extension €147; valid to 31 Oct 2027.
  - ⚠️ **If you live outside the European zone, you must take the World extension, and outside your home country you are covered only on FFCAM-supervised outings** ([FFCAM insurance](https://www.ffcam.fr/assurance.html)).
  - It is probably **not suitable** for an independent trip by a non-European resident.
- **Verify in your policy:**
  - search and rescue **including helicopter**;
  - hiking with **no altitude limit, or a limit of at least 3,000 m**;
  - **solo hiking** not excluded;
  - medical treatment in France;
  - repatriation;
  - trip cancellation (non-refundable trains).

## 10. Rules, Access & Trail Management

### 10.1 Access Requirements

- **No permit, entrance fee, registration or quota** for hiking in the Vanoise National Park.
- **Bivouac must be booked** with the relevant refuge (see 6.4).
- Hut reservations are the only practical "permit".

[PNV regulations](https://vanoise-parcnational.fr/votre-visite/preparer-sa-visite/la-reglementation-dans-le-coeur-du-parc) · [PNV FAQ](https://vanoise-parcnational.fr/foire-aux-questions) · [Hut booking portal](https://www.refuges-vanoise.com/)

### 10.2 Regulations

The park core zone (*cœur du parc*) covers most of the loop.

| Rule | Detail |
|---|---|
| **Dogs** | **Banned, even on a lead.** Fine €135. |
| **Drones** | **Banned.** Fine €135. |
| Camping | Only booked bivouac at designated huts, 19:00–08:00. Fine €68. |
| Fire | No fires; camping stoves allowed. |
| Flora / fauna / minerals | No picking or collecting; no disturbing wildlife; no loud noise. |
| Waste | **Carry out everything.** Huts are not bins. |
| Bikes / vehicles | Bikes on designated tracks only; motor vehicles banned. |
| Swimming | Discouraged in lakes. |

Sources: [PNV regulations](https://vanoise-parcnational.fr/votre-visite/preparer-sa-visite/la-reglementation-dans-le-coeur-du-parc) · [PNV FAQ](https://vanoise-parcnational.fr/foire-aux-questions) · [cycling rules](https://www.vanoise-parcnational.fr/sites/vanoise-parcnational.fr/files/raa/reglementation_cycles_en_coeur_-_2022.pdf)

### 10.3 Trail Etiquette

- **Huts:**
  - Boots off at the entrance; use the hut shoes.
  - Quiet in dorms from about 22:00.
  - Bring and use a liner.
  - Pack the night before if you leave early.
  - Pay your bill the evening before.
- **Bookings:** cancel or phone if your plans change, because **huts start searches for no-shows**. Arrive in time for dinner.
- **Livestock:** go around flocks, close gates, and stay calm near patous.
- **Trail:** walkers going uphill have priority. Greet with "bonjour". Don't build cairns or shortcut switchbacks.
- **Leave no trace:** carry out all rubbish, including organic waste. Use hut toilets.

## 11. Gear & Packing

### 11.1 Route-Specific Gear Strategy

A light hut-trekking kit (no tent, stove or food beyond snacks), plus **early-season snow gear** and **cash**. Aim for self-sufficiency for one day (water, food, warmth) on long committing crossings like the Col d'Aussois.

### 11.2 Footwear

- **Recommended:** mid or high hiking boots or sturdy approach shoes with a stiff, grippy sole (Vibram-type). Waterproof is useful for névés and wet stream crossings. Make sure microspikes fit them.
- **Why:** rough scree, boulder fields, chain sections, firm snow in early July, and long rocky descents.
- Low trail runners work for experienced hikers later in summer, but are **marginal on early-July névés**. Wet feet in low shoes were reported in July 2020.
- **Hut shoes are supplied**, so you don't need camp shoes.

### 11.3 Clothing & Layering

| Layer | Item |
|---|---|
| Base | Merino or synthetic T-shirt; long-sleeve sun shirt |
| Legs | Trekking trousers (tick protection on approaches); optional shorts |
| Mid | Fleece or light insulated jacket |
| Warm | Light down or synthetic puffy (cols 0–10 °C; frost possible at night) |
| Extremities | Thin gloves, warm hat, buff |
| Hut | Dry base layer and socks for evenings |

### 11.4 Rain & Weather Protection

- A breathable waterproof jacket is required (afternoon storms). Waterproof trousers or a light rain skirt.
- Pack liner or dry bags.
- **Sun:** category 3–4 sunglasses (snow glare), SPF 50, lip balm, a brimmed hat.

### 11.5 Sleeping & Accommodation Gear

- **Sleeping-bag liner (required)**: silk or synthetic. Rental at Valette costs €5.
- Earplugs and an eye mask for dorms; a small quick-dry towel; toiletries.
- **Duvets, blankets and hut shoes are supplied.** You don't need a sleeping bag unless you bivouac.

### 11.6 Food & Water Equipment

- **Water:** 2 × 1 L bottles or a bladder (2 L capacity). **Filter or tablets.**
- A small reusable box for hut picnics (the park suggests one; Arpont gives €1 off if you bring your own).
- No stove needed.

### 11.7 Navigation, Electronics & Charging

- Phone with offline IGN/OSM maps and the GPX.
- **Power bank of 10,000–20,000 mAh** (hut charging is not guaranteed).
- EU type C/F plug adapter if needed; a short cable.
- Paper IGN 3534 OT and a compass.
- **SIM:** use one that can reach **Bouygues Telecom**, the best network on this route (see 12.3). Keep a voice SIM active if your data plan is eSIM-only.
- ✓ **Satellite messenger or phone satellite SOS:** recommended for solo hikers. Day 2 and the Col de la Vanoise hut have no mobile network at all.
- Headlamp.

### 11.8 Safety & Emergency Equipment

| Item | Note |
|---|---|
| **Microspikes / light crampons** | ✓ **Recommended for early July** (visugpx, Cicerone, park névé warnings). CRS Alpes warns that light "forest-type" crampons are **unsuitable on steep hard snow**, so turn back rather than push on. |
| Ice axe | Only if the hut keepers report steep snow on the Col d'Aussois in late June 2027. Cicerone: "usually need an ice axe" early season. Know how to use it, or don't rely on it. |
| Trekking poles | Strongly advised (névés, stream crossings, descents) |
| First aid | Blister kit, tape, painkillers, antiseptic, **tick remover**, personal meds, elastic bandage |
| Emergency | Survival blanket or bivvy bag, whistle, headlamp, a small amount of emergency food |
| Repair | Duct tape, cord |
| Sun / repellent | Sunscreen, tick repellent |

### 11.9 Pack Weight

- **Target: 6–9 kg** including 1.5–2 L of water and snacks; +0.5–0.9 kg with microspikes and an ice axe. Cicerone's author carried about 10 kg; there is no authoritative target.
- **Where to save weight:**
  - No sleeping bag, stove or tent.
  - Hut shoes are supplied.
  - Picnics are bought daily, so carry only 1 day's snacks plus an emergency reserve.
  - One spare set of clothes.
  - Take only the part of the paper map you need.

- **Masts:**

  - There is **no mast within 4 km** of the Col d'Aussois, Fond d'Aussois, Arpont or the Col de la Vanoise hut ([Arcep sites](https://data.arcep.fr/mobile/sites/2026_T2/)).
- **Gaps by stage:**
  - **Day 2:** Roc → Col d'Aussois → Fond d'Aussois. Effectively **no coverage on any network**.

✓ **Recommended:**
1. **Primary network: Bouygues Telecom.** It is the only operator modelled at Dent Parrachée, Plan Sec and Bellecombe, and it is strongest at Valette, Arpont and the Lac des Vaches. Orange is the weakest on the remote stages.
2. **If you live outside the EU:**
   - Either a **Bouygues "My European" SIM/eSIM**: about €14.90 for 15 GB data, or about €19.90 with calls (third-party prices conflict). See the [Bouygues tourist prepaid summary, 22 Jun 2026](https://www.bouyguestelecom.fr/static/cms/tarifs/RC-cartes-prepayees-touristes-myeuropean-sim-esim-260622.pdf).

   - Travel eSIMs are usually **data-only**, so keep a voice-capable SIM active in dual-SIM mode.
3. **If you have an EU SIM:** "roam like at home" applies. Check that your operator's French roaming partners include Bouygues, then select networks manually on the trail.
4. **Backup: a satellite messenger is warranted for a solo hiker.** Day 2 and the Col de la Vanoise hut are total dead zones, so a second SIM would not help there.
   - Two-way Iridium devices (Garmin inReach, Zoleo) work everywhere.
   - **iPhone 14 or later** Emergency SOS via satellite works in France, free for 2 years after activation ([Apple, 5 Oct 2026](https://support.apple.com/en-us/101573)).
   - **Pixel 9 or later** (not the 9a) Satellite SOS lists France ([Google](https://support.google.com/pixelphone/answer/15254448)).
   - Phone satellite SOS needs an open sky.
5. **Buy before you arrive.** No SIM shops were confirmed in Pralognan or Moûtiers. French prepaid SIMs need ID registration.

**Wi-Fi:**
- No Wi-Fi at the Col de la Vanoise hut.
- Park huts (Valette, Arpont) have only an operational internet link, which guests generally can't use ([Valette](https://refuge-valette.vanoise.com/un-refuge-ecoresponsable)).
- Pralognan hotels and the tourist office reception have Wi-Fi.

**Offline needs:** maps, GPX, timetables, hut confirmations and the emergency numbers (see 5.3).

**Confidence: Medium.** The modelled data are current (Q2 2026). Observed reports are sparse and mostly undated, and operator networks can change by July 2027.

## 13. Planning the Trek

### 13.1 Recommended Itinerary

✓ **Recommended:** **classic loop, anticlockwise from Pralognan, 5 walking days, Tue 6 – Sat 10 July 2027**, plus an arrival night and ideally one buffer day.

| Day | Date (2027) | Route | km | ↑ | ↓ | h | 🛏️ Night |
|---|---|---|---|---|---|---|---|
| 0 | Mon 5 Jul | Train to Moûtiers → S66 bus (13:30 ran unconditionally in 2026) → Pralognan | — | — | — | — | Pralognan hotel/gîte |
| 1 | Tue 6 Jul | Pralognan → **Pas de l'Âne** → Refuge de la Valette (or Fontanettes → Col du Grand Marchet only if the hut keeper confirms it is snow-free) | ~7.5–10 | ~1,200–1,300 | ~300–400 | 4–5 | **Valette** (2,590 m) |
| 2 | Wed 7 Jul | Valette → Roc → **Col d'Aussois** (2,914 m) → Fond d'Aussois | ~16–20 | ~1,150–1,250 | ~1,400–1,450 | 7.5–8 | **Fond d'Aussois** (2,346 m) |
| 3 | Thu 8 Jul | Fond d'Aussois → Aussois balcony → Refuge de l'Arpont | ~20 | ~860–1,000 | ~880–1,000 | 6.5–7 | **Arpont** (2,309 m) |
| 4 | Fri 9 Jul | Arpont → Lac Blanc / Lozières → Clapier Blanc → Refuge du Col de la Vanoise | ~14 | ~670 | ~450 | 5–5.5 | **Col de la Vanoise** (2,517 m) |
| 5 | Sat 10 Jul | Col de la Vanoise → Lac des Vaches → Fontanettes (shuttle) or Pralognan | 5.7–8 | ~20 | ~900–1,100 | 2–2.5 | Pralognan (or S66 17:00 to Moûtiers) |
| Buffer | Sun 11 Jul | Weather or spare day; travel home | | | | | |

Distance and ascent come from the official GPX (reversed) and Cicerone. Total is about **63–72 km, ↑~3,900–4,300 m**.

**Why this plan:**
1. **Snow safety.** Going anticlockwise means you **climb** both névé-prone crossings: Pas de l'Âne/Grand Marchet on day 1 and the Col d'Aussois north side on day 2. Climbing is safer than descending firm snow. An Altituderando reader preferred this direction for the same reason.
2. **Early-season advice.** Using the **Pas de l'Âne** on day 1 follows the park's advice for "until early July".
3. **Transport fit.** Starting Monday 5 July should coincide with the start of the **full S66 summer bus service** (2026 pattern: 6 Jul Mon–Fri), and skips the likely **trail-race weekend (~4 Jul 2027, unconfirmed)**. Day 5 is short, so you can catch the afternoon bus or relax in Pralognan.
4. **Acclimatisation.** The night in Pralognan (1,418 m) before sleeping at 2,590 m helps.
5. **Bail-outs on long days.** The long days 2–3 have exits: Aussois village / S52 bus, then Termignon / line 2.
6. **Easier 6-day version.** If you can spare a day, **sleep at the Roc after Valette** (day 2a: Valette → Roc, 3 h; day 2b: Roc → Fond d'Aussois, 6 h). This removes the hardest day.

> 💡 **Tip:** if the RD915 road to Pralognan is restricted in 2027, run the **same loop from Aussois** (official trace 73951): train to Modane, S52 to Aussois, then Fond d'Aussois → Arpont → Col de la Vanoise → Valette → Roc → Col d'Aussois → Fond d'Aussois/Aussois. This version climbs the Grand Marchet chains from the Dard side, so the park's early-July advice to avoid that section still applies: confirm it is snow-free with the hut keepers, or detour via the Pas de l'Âne.

3. **Departure:**

4. **Plan B (Maurienne):**
   - Train to **Modane**, then S52 to **Aussois** (09:15 / 14:05 / 17:00 Mon–Fri in 2026).
   - Return Termignon or Aussois → Modane by S52, then train.

### 13.4 Contingency Planning

| Situation | Response |
|---|---|
| **Bad weather / storms** | Start at 07:00 and cross cols before noon. If storms are forecast for the Col d'Aussois day, wait a day at Valette or the Roc (use the buffer day), or go around: Valette → Pralognan → bus/train → Modane → Aussois. That loses a day of walking but keeps the loop. |
| **Too much snow on the Col d'Aussois** | Turn back. From the Roc, return to Pralognan and do an out-and-back to Col de la Vanoise and Arpont, or transfer to Aussois by public transport (Moûtiers–Chambéry–Modane, most of a day). |
| **Grand Marchet snowy** | Use the Pas de l'Âne or Les Prioux + shuttle (planned for day 1 anyway). |
| **Fatigue** | Split day 2 at the Roc. On day 3, stop at Plan Sec / Fournache instead of continuing. On day 4, take Entre-Deux-Eaux. |
| **Injury** | Call 112. Exits are listed in 9.3. Between the Roc and Fond d'Aussois you are committed, so turn back early if unsure. |
| **Missed bus** | Taxi (Pralognan: 3 firms; Modane: 9 firms in Haute-Maurienne), or the next S66. |
| **Hut full / closed** | Neighbouring huts: Aussois has 5 huts within 4 km; Entre-Deux-Eaux and Plan du Lac near Arpont; Barmettes, Roc or Pralognan near Valette. Bivouac with half-board where allowed. |
| **Delayed arrival** | The 18:30 S66 (on-demand booking) or a taxi. Shift all hut bookings (free if more than 2 days ahead; otherwise phone). |
| **RD915 closed** | Maurienne start (13.1 tip). |
| **Abandoning** | Valley exits in 9.3. Getting back to Pralognan from the Maurienne takes about a day by public transport. |

## 15. Route-Specific Considerations

### 15.1 Special Characteristics

#### Two "classic" definitions

The park's own sheets disagree about which loop is the base route: 2025 says the Col d'Aussois loop, 2024 says the 7-day Chavière loop. Tourist pages still mix the two. Use the 2025 sheet and the Geotrek records (updated 4 Nov 2026) as the reference.

#### Early-season névé crux

The route's character in early July is shaped by lingering snow on north-facing slopes. The park explicitly recommends the Pas de l'Âne over the Grand Marchet until early July. Direction choice is your main mitigation.

#### Cash-based hut economy

Several huts are cash or cheque only. Withdraw in Pralognan before starting.

#### Fragile valley access

Pralognan is a dead-end valley with one road (RD915), which was disrupted by the 2026 fire. The Maurienne side has rail at Modane, but its line has ongoing works through 2028.

#### Seasonal transport cut-overs

Full summer bus service starts in the first or second week of July. A trek starting 1–3 July would face thinner connections.

### 15.2 Local Knowledge

- **Ask the hut keepers** about the next day's passes each evening. They give the most current condition reports, and the park's route sheet says to check with them about footbridges.
- **Cross streams in the morning** (park). Snowmelt flow rises through the afternoon.
- **Order your picnic the evening before.**
- **Avoid the 20 July–15 August peak**, when shuttles are "insuffisantes ou saturées" (insufficient or saturated) and bivouac spots are hard to get (PNV 2026 review).
- **Climb, don't descend** the Col d'Aussois and the Grand Marchet early in the season (Altituderando reader, consistent with park snow warnings).
- **Lac de l'Arpont and the Pointe de l'Observatoire** are the most rewarding short side trips.
- **Patous:** check Map Patou and go around flocks.

### 15.3 Names & Pronunciation

French stress is light and falls on the last syllable; the stressed syllable is shown in **CAPITALS**.

Sources key:
- **[S]** means the pronunciation is supported by a published IPA (phonetic) transcription from [French Wiktionary](https://fr.wiktionary.org/) or French/English Wikipedia.
- **[R]** means no pronunciation source was found, so the respelling follows standard French spelling rules. Confirm [R] entries with a local.

| Name | Type | Say it | IPA | Note |
|---|---|---|---|---|
| Vanoise | Massif, park | va-**NWAHZ** | [va.nwaz] [S] | The s sounds like z; the final e is silent |
| Tour des Glaciers de la Vanoise | Trail | toor day gla-**SYAY** duh la va-**NWAHZ** | — [R] | The s at the end of "des" and "Glaciers" is silent |
| Pralognan-la-Vanoise | Start/finish village | pra-lo-**NYAHN** | [pʁalɔɲɑ̃] [S] | **"gn" = "ny"** as in canyon. The final "an" is nasal (no n sound). Locals shorten it to "Pralo". |

| Val-Cenis | Commune | val suh-**NEE** | — | ⚠️ Uncertain whether the final s is said; ask locally |

## 17. Research Sources & Confidence

### 17.1 Research Method

- **When:** researched 7 November 2026 by live web research. Ten parallel research strands covered:
  1. route and stages;
  2. huts, rules, food and costs;
  3. public transport;
  4. weather, safety and status;
  5. Europe travel-vaccine risk;
  6. TBE risk;
  7. historical weather (Météo-France daily station data and ERA5 reanalysis, computed directly);
  8. mobile networks (Arcep coverage data queried at each hut and pass);
  9. names and pronunciation;
  10. the GeoMap (coordinates and official GPX tracks).
- **Sources consulted:**
  - official park documents and its Geotrek database, including the GPX analysed directly;
  - hut websites;
  - transport operator timetables (PDF);
  - Météo-France climate normals;
  - French government and health-agency sources (service-public, Santé publique France, ARS);
  - specialist publications (Cicerone, Altituderando, camptocamp);
  - recent trip reports.
- **Conflicts:** resolved by authority, then recency, then specificity. Unresolved conflicts are flagged in place.
- **Time-sensitive information** (prices, timetables, closures, hut dates) carries 📅 dates. Stable facts (geography, rules) do not.

### 17.2 Source Hierarchy

1. **Official trail and park authority:** PNV route sheets (2024, 2025), Geotrek rando.vanoise.com, park regulations and FAQ, park decisions and news.
2. **Government and transport operators:** Département de la Savoie, service-public.fr, Santé publique France, ARS Auvergne-Rhône-Alpes, Météo-France, SNCF Réseau and SNCF Connect, cars Région Savoie / Altibus, HMV mobility guide.
3. **Primary service providers:** hut websites (vanoise.com and ffcam.fr), refuges-vanoise.com, the Pralognan and HMV tourist offices, FFCAM insurance.
4. **Specialist publications:** Cicerone, FFRandonnée, Altituderando, camptocamp, TravelHealthPro, CDC Yellow Book.
5. **Firsthand reports:** visugpx (2024), camptocamp outings (2020–2026), Florine Tournier (2025), news sites (info.fr, e-sante.fr).

### 17.6 Confidence in Recommendations

- **Anticlockwise direction and the Pas de l'Âne in early July: high.** This combines park guidance with general snow-safety practice.
- **Start date of Mon 5 July: medium.** It rests on the 2026 bus pattern and an unconfirmed race date.
- **The 5-day schedule: medium.** It fits fit, experienced hikers. Day 2 is long, and less experienced or slower hikers should take the 6-day version with a Roc night.
- **Microspikes: high** as a minimum. Whether an ice axe is needed depends on 2027 conditions and your own skill, so this is a judgment call.
- **TBE vaccination: low to medium.** It depends on your personal hiking pattern and medical factors; consult a clinician.

  if(location.hash==='#content'){$('content').focus();return;}
  if(this.current)this.positions.set(this.current,window.scrollY);
  let parts;try{parts=decodeURIComponent(location.hash).replace(/^#\//,'').split('/');}catch{parts=[];}
  let section=this.model.sections.find(s=>s.slug===parts[0]),page=section?.pages.find(p=>p.slug===parts[1]),anchor=parts.slice(2).join('/');
  if(!page){let alias;try{alias=this.model.anchors.get(decodeURIComponent(location.hash.slice(1)));}catch{}page=alias?.page||section?.pages[0]||this.model.pages[0];anchor=alias?.id||'';history.replaceState(null,'',page.route+(anchor?'/'+anchor:''));}

}
